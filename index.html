<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀荘 燕返し</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* Layout: the smoky parlor table on the left, the cheat drawer (tabbed) docked beside it on wide screens and right under your hand on phones. Deliberately one dark look. */
:root{
  --bg:#15121C; --panel:#1E1A29; --panel-2:#272236; --line:#3A3350; --fg:#EEE8F6; --muted:#A69DBB;
  --felt:#22305A; --felt-2:#131B36; --felt-line:#3A4C80; --felt-ink:#E8EDFA; --felt-dim:#A9B5D6;
  --brass:#DDB467; --brass-ink:#1F1606; --trick:#B992FF; --trick-ink:#170C2C; --trick-soft:#2E2347;
  --hot:#EF6A5B; --hot-ink:#2A0905; --good:#7FD39A; --good-soft:#1B3325; --warn-soft:#3A2F14; --warn:#F0CF7E;
  --tile-face:#FAF5E6; --tile-edge:#E2D9BF; --tile-back:#C68F33; --tile-back-2:#A06E1F; --tile-ink:#1C1C1A; --tile-red:#B3261E; --tile-green:#1E7A4C; --tile-blue:#1F4E8C;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"M PLUS 1","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 60px;
  background-image:radial-gradient(90% 600px at 50% -10%, rgba(221,180,103,.10), transparent 70%);background-repeat:no-repeat}
#app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
.btn{font-weight:700;font-size:14px;border-radius:10px;padding:8px 15px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.hot{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.btn.trick{background:var(--trick);border-color:var(--trick);color:var(--trick-ink)}
.btn.on{background:var(--felt-ink);color:var(--felt-2);border-color:var(--felt-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.cheat:focus-visible,.mode:focus-visible,.lnk:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lnk{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* tiles */
.tile{--w:var(--tw,40px);width:var(--w);padding:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;transition:transform .12s ease;position:relative;flex:0 0 auto}
button.tile{cursor:pointer}
.tile .face{display:block;width:100%;aspect-ratio:3/4;background:var(--tile-face);border-radius:calc(var(--w) * .13);
  box-shadow:inset 0 -2px 0 var(--tile-edge), 0 calc(var(--w) * .08) 0 var(--tile-back), 0 calc(var(--w) * .09 + 2px) 4px rgba(0,0,0,.4)}
.tile svg{display:block;width:100%;height:100%}
.tile text{font-family:var(--mincho);font-weight:800;text-anchor:middle}
.tile .lbl{font-size:max(9px, calc(var(--w) * .26));line-height:1.1;margin-top:calc(var(--w) * .13);white-space:nowrap;color:var(--felt-dim)}
.tile.back .face{background:linear-gradient(160deg,var(--tile-back),var(--tile-back-2));box-shadow:0 2px 3px rgba(0,0,0,.4)}
.tile.sel{transform:translateY(-9px)}
.tile.sel .face{outline:2px solid var(--brass);outline-offset:1px}
.tile.swapsel{transform:translateY(-9px)}
.tile.swapsel .face{outline:2px solid var(--trick);outline-offset:1px;box-shadow:0 0 14px var(--trick)}
.tile.mark .face{outline:2px solid var(--brass);outline-offset:1px}
.tile.last .face{outline:2px solid var(--hot);outline-offset:1px}
.tile.dim{opacity:.4}
.tile.danger::after{content:"";position:absolute;left:8%;right:8%;bottom:-6px;height:3px;border-radius:2px;background:var(--hot)}
.tile.rch,.tile.side{width:calc(var(--w) * 1.333)}
.tile.rch .face,.tile.side .face{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile.rch svg,.tile.side svg{transform:rotate(-90deg) scale(1.333);flex:0 0 auto}
.tile:focus-visible{outline:none}
.tile:focus-visible .face{outline:2px dashed var(--brass);outline-offset:2px}
.gap{width:calc(var(--tw,40px) * .35);flex:0 0 auto}
.row{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end}

/* menu */
.hero{display:flex;flex-direction:column;gap:6px;padding-block:10px 4px}
.kicker{font-size:12px;letter-spacing:.2em;color:var(--brass)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,64px);line-height:1;letter-spacing:.04em}
.hero h1 span{color:var(--trick)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:linear-gradient(170deg,var(--felt),var(--felt-2));border:1px solid var(--felt-line);border-radius:16px;padding:16px;cursor:pointer;color:var(--felt-ink)}
.mode .mt{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.mode .md{font-size:13.5px;color:var(--felt-dim)}
.mode .go{margin-top:auto;font-weight:700;color:var(--brass);font-size:14px}
.odaibox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.odaibox h2{font-family:var(--display);font-weight:400;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.chip .ok{font-size:10.5px;font-weight:700;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:0 4px;line-height:1.4}
.chip[aria-pressed="true"] .ok{color:var(--brass-ink);border-color:var(--brass-ink)}
.chip.ym{border-color:#6B5A2E}
.tricks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.trickc{background:var(--trick-soft);border:1px solid #4A3A72;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.trickc b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--trick)}
.trickc span{font-size:13px;color:var(--muted)}
.recs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.recs b{color:var(--fg)}

/* table */
.felt{container-type:inline-size;background:radial-gradient(120% 90% at 50% 40%, var(--felt) 0%, var(--felt-2) 100%);color:var(--felt-ink);border-radius:18px;padding:12px 10px 14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--felt-line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--felt-dim);font-variant-numeric:tabular-nums}
.topbar .kn{font-family:var(--display);font-size:20px;color:var(--felt-ink);letter-spacing:.04em}
.topbar b{color:var(--felt-ink)}
.topbar .dora{display:flex;align-items:center;gap:5px;--tw:22px}
.topbar .sp{flex:1}
.opps{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.seat{background:rgba(0,0,0,.18);border:1px solid transparent;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seat.active{border-color:var(--brass)}
.shead{display:flex;align-items:center;gap:7px;font-size:13px;flex-wrap:wrap}
.wind{font-family:var(--mincho);font-weight:800;font-size:15px;width:24px;height:24px;border-radius:6px;background:var(--felt-ink);color:var(--felt-2);display:grid;place-items:center;flex:0 0 auto}
.nm{font-weight:700}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;border:1px solid var(--felt-line);color:var(--felt-dim)}
.tag.oya{border-color:var(--brass);color:var(--brass)}
.tag.rch{background:var(--hot);border-color:var(--hot);color:var(--hot-ink)}
.tag.tp{background:var(--trick);border-color:var(--trick);color:var(--trick-ink)}
.pts{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.shand{--tw:17px}
.river{--tw:20px;display:flex;flex-wrap:wrap;gap:2px;min-height:28px;align-content:flex-start}
.mine .river{--tw:24px;max-width:calc(6 * 26px);margin:0 auto;min-height:34px}
.sinfo{font-size:12.5px;color:var(--trick)}
.sinfo .row{--tw:16px;display:inline-flex;vertical-align:middle;margin-left:4px}
.mine{display:flex;flex-direction:column;gap:10px;align-items:center;border-top:1px dashed var(--felt-line);padding-top:12px}
.mine .shead{width:100%}
.status{font-size:14px;text-align:center;min-height:1.6em;max-width:62ch}
.status b{color:var(--brass)}
.status .t{color:var(--trick)}
.note{font-size:12.5px;color:var(--felt-dim);text-align:center}
.hand{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-items:flex-end;--tw:clamp(21px, calc((100cqw - 34px) / 14.4), 48px)}
@media (max-width:520px){.felt{padding:10px 6px 12px}}
.wintag{display:flex;flex-direction:column;align-items:center;gap:2px}
.wintag small{font-size:10.5px;font-weight:700;color:var(--brass);letter-spacing:.06em}

.panel{background:var(--panel);border:1px solid #4A3A72;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--display);font-weight:400;font-size:17px;color:var(--trick);display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h3 small{font-family:var(--body);font-size:12px;color:var(--muted)}
.panel p{margin:0;font-size:13.5px;color:var(--muted)}
.panel p b{color:var(--fg)}
.pal{display:flex;flex-direction:column;gap:6px}
.pal .row{gap:4px;--tw:clamp(22px, calc((100cqw - 40px) / 9.7), 40px)}
.pt{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.pt:disabled{cursor:not-allowed}
.pt:disabled .tile{opacity:.25}
.pt .cnt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.pt .cap{font-size:9.5px;line-height:1.15;font-weight:700;max-width:calc(var(--tw) + 10px);text-align:center;color:var(--brass);min-height:11px;overflow-wrap:anywhere}
.pt.win .tile .face{outline:2px solid var(--brass);outline-offset:1px;box-shadow:0 0 12px var(--brass)}
.pt.up .tile .face{outline:2px solid var(--good);outline-offset:1px}
.pt.on .tile .face{outline:2px solid var(--trick);outline-offset:1px}
.nexts{display:flex;flex-wrap:wrap;gap:6px}
.nx{display:flex;flex-direction:column;align-items:center;gap:2px;--tw:26px;font-size:10.5px;color:var(--muted)}
.nx.me{color:var(--brass);font-weight:700}
.draft{display:flex;flex-wrap:wrap;gap:3px;min-height:46px;align-items:flex-end;--tw:clamp(18px, calc((100cqw - 70px) / 13.6), 34px);background:var(--panel-2);border-radius:10px;padding:8px}
.draft .ph{font-size:12px;color:var(--muted)}
.best{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.best .row{--tw:28px;gap:6px;align-items:center}

/* result */
.result{background:var(--panel);border:1px solid var(--brass);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.result .big{font-family:var(--display);font-size:clamp(30px,8vw,44px);line-height:1;color:var(--brass);letter-spacing:.06em}
.result .who{font-size:14px;color:var(--muted)}
.result .hand{--tw:clamp(18px, calc((100cqw - 50px) / 15), 36px);justify-content:flex-start}
.groups{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.grp .gt{display:flex;gap:2px}
.grp .gl{font-size:11px;color:var(--muted);white-space:nowrap}
.mini{--tw:22px}
.ylist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ylist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px}
.ylist .yn{font-weight:700}
.ylist .yn small{font-weight:400;color:var(--muted);margin-left:6px}
.ylist .yh{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.ylist .yd{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.score{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.score .pv{font-family:var(--display);font-weight:400;font-size:24px;color:var(--brass)}
.pays{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.pays .plus{color:var(--good)}
.pays .minus{color:var(--hot)}
.banner{border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.banner.ok{background:var(--good-soft);color:var(--good)}
.banner.ng{background:var(--warn-soft);color:var(--warn)}
.ranks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ranks li{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:10px;padding:10px 14px;font-variant-numeric:tabular-nums}
.ranks .rk{font-family:var(--display);font-size:22px;color:var(--brass);width:2.2em}
.ranks .rp{margin-left:auto;font-weight:700}
.tp-list{display:flex;flex-direction:column;gap:8px}
.tp-list .tpr{display:flex;flex-direction:column;gap:4px}
.tp-list .tpr .hand{--tw:20px;justify-content:flex-start}

/* melds & calls */
.melds{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.meld{display:inline-flex;gap:1px;align-items:flex-end}
.tile.taken{opacity:.35}
.cmelds{--tw:15px}
.mymelds{--tw:clamp(18px, calc((100cqw - 60px) / 18), 32px);justify-content:center}
.btn.call{display:inline-flex;flex-direction:column;align-items:center;gap:4px;padding:7px 12px;background:var(--trick-soft);border-color:var(--trick);color:var(--fg)}
.btn.call .row{--tw:20px;gap:1px}
.btn.kan{border-color:var(--brass);color:var(--brass)}
.kd{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
.kv.rd{align-items:center}
.kv.rd span{display:inline-flex;align-items:center;gap:4px;--tw:20px}
.rules dl{margin:0;display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px 14px;font-size:14px}
.rules dt{font-weight:700;color:var(--brass)}
.rules dd{margin:0;color:var(--fg)}
@media (max-width:520px){.rules dl{grid-template-columns:1fr;gap:2px}.rules dd{margin-bottom:8px}}
.chip.kanc{border-color:#4A3A72;color:var(--trick)}
.chip.kanc[aria-pressed="true"]{background:var(--trick);color:var(--trick-ink);border-color:var(--trick)}
.grp-t .gs{font-weight:400;letter-spacing:0;color:var(--muted)}
.odsel .tip{color:var(--trick)}
.pts.prac{font-size:11.5px;font-weight:500;color:var(--felt-dim)}
/* gauge cheats */
.gbar{display:inline-block;position:relative;width:46px;height:6px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle}
.gbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--trick),var(--brass));border-radius:999px}
.gbar.lg{width:100%;height:10px}
.gaugebox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px 0;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.gaugebox b{color:var(--fg);font-size:16px}
.gaugebox .bonus{grid-column:1 / -1;color:var(--brass);font-size:12px;font-weight:700}
.navi{margin:12px 14px 0;background:var(--panel-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.navi ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.navi li{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.navi b{color:var(--brass)}
.navi .mt{--tw:20px;display:inline-flex}
.navi .hl,.hl{color:var(--trick)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px;padding:12px 14px 0}
.ccard{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--trick-soft);border:1px solid #4A3A72;border-radius:12px;padding:8px 10px;cursor:pointer;color:var(--fg);min-height:74px}
.ccard .cn{font-family:var(--display);font-size:15px;line-height:1.2;padding-right:30px}
.ccard .cc{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums}
.ccard .cd{font-size:11.5px;color:var(--muted);line-height:1.4}
.ccard.big{border-color:#6B5A2E}
.ccard.on{background:var(--trick);color:var(--trick-ink);border-color:var(--trick)}
.ccard.on .cd,.ccard.on .cc{color:var(--trick-ink)}
.ccard:disabled{opacity:.42;cursor:not-allowed}
.ccard:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.cnote{margin:10px 14px 14px;font-size:12px;color:var(--muted)}
.flow{margin:12px 14px 0;border:1px solid var(--trick);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(185,146,255,.06)}
.flow p{margin:0;font-size:13px;color:var(--muted)}
.flow p b{color:var(--fg)}
.flow .warn{color:var(--hot)}
.fh{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:17px;color:var(--trick)}
.tbtns{display:flex;flex-wrap:wrap;gap:6px}
.rv{display:flex;flex-direction:column;gap:4px}
.rvn{font-size:12px;color:var(--muted)}
.rv .row{--tw:24px;gap:3px}
.thand{--tw:26px;gap:3px}
.flow .pal .row{--tw:clamp(20px, calc((100cqw - 110px) / 9.7), 36px)}
.ann{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;text-align:center;background:rgba(21,18,28,.92);border:2px solid var(--trick);border-radius:18px;padding:16px 22px;width:min(92vw,520px);box-shadow:0 0 40px rgba(185,146,255,.45);animation:annIn .35s ease-out}
.ann .aw{font-size:13px;color:var(--muted)}
.ann .an{font-family:var(--display);font-size:clamp(30px,9vw,52px);line-height:1.1;color:var(--trick);letter-spacing:.04em}
.ann .at{font-size:14px;margin-top:6px}
.ann-note{border-color:var(--hot);box-shadow:0 0 50px rgba(239,106,91,.5)}
.ann-note .an{color:var(--hot)}
.ann-tsubame .an,.ann-kami .an{color:var(--brass)}
.ann-daipan{animation:annIn .35s ease-out,shake .4s .1s}
@keyframes annIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-10px}75%{margin-left:10px}}
.blackout{position:fixed;inset:0;z-index:35;background:#000;display:grid;place-items:center;color:#555;font-family:var(--display);font-size:28px;letter-spacing:.2em;animation:flick .25s steps(2) 2}
@keyframes flick{50%{background:#111}}
.wolf .vlist{display:flex;flex-direction:column;gap:8px}

.btns.left{justify-content:flex-start}
.acts .btn{min-width:84px}
.turn{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:rgba(255,255,255,.08);color:var(--felt-dim)}

.od{color:var(--brass)}
.dora.gan .tile .face{outline:1px solid var(--trick);outline-offset:1px}
.hc{display:none;font-size:11.5px;color:var(--felt-dim)}

  .opps.n3 .seat{padding:6px 6px 8px;gap:5px}
  .opps.n3 .shead{font-size:12px;gap:4px}
  .opps.n3 .wind{width:20px;height:20px;font-size:13px}

  .opps.n3 .hc{display:block}
  .opps.n3 .sinfo{font-size:11px}

}
/* drawer */
.drawer{container-type:inline-size;background:var(--panel);border:1px solid #4A3A72;border-radius:16px;overflow:hidden}
.dtitle{display:flex;align-items:baseline;gap:8px;padding:12px 14px 0;font-family:var(--display);font-size:16px;color:var(--trick)}

.tabs{display:grid;gap:6px;padding:10px 12px 0;grid-template-columns:repeat(4,minmax(0,1fr))}

.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 8px;border-radius:12px 12px 0 0;border:1px solid transparent;border-bottom:0;background:var(--trick-soft);cursor:pointer;color:var(--fg);text-align:center}

.steps li::before{content:counter(st);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--panel-2);color:var(--muted);flex:0 0 auto}

.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tlist li{display:grid;grid-template-columns:4em minmax(0,1fr);gap:8px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:13px}
.tlist .row{--tw:18px;display:inline-flex;vertical-align:middle}
.tlist .sub{font-size:12px;color:var(--muted);margin-top:2px}
.nexts .nx{--tw:clamp(20px, calc((100cqw - 90px) / 12), 28px)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,6,14,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{width:min(100%,620px);container-type:inline-size;margin-block:auto}
.rhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.peekbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:12px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));background:linear-gradient(transparent,rgba(8,6,14,.9) 40%)}
/* menu */
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.mtabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brass)}
.lead{margin:0;font-size:14px;color:var(--muted)}
.lead b{color:var(--fg)}
.odsel{display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px}
.odsel b{color:var(--brass)}
.odsel .yd{font-size:12.5px;color:var(--muted)}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.howto ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chip.static{cursor:default;opacity:.5}
.chip.static.done{opacity:1;border-color:var(--good);color:var(--good)}
.recs.big{font-size:15px;gap:8px 24px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
/*ENGINE2: 副露対応の判定エンジン*/
const HON=['東','南','西','北','白','發','中'];
const KN='一二三四五六七八九';
const SN=['萬','筒','索'];
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sortT=a=>a.slice().sort((x,y)=>x-y);
const counts=a=>{const c=new Array(34).fill(0);for(const t of a)c[t]++;return c;};
const expand=c=>{const a=[];c.forEach((n,t)=>{for(let k=0;k<n;k++)a.push(t)});return a;};
const isTH=t=>t>=27||t%9===0||t%9===8;
const tileName=t=>t>=27?HON[t-27]:(t<9?KN[t]+'萬':(t%9+1)+SN[Math.floor(t/9)]);
const TH13=[0,8,9,17,18,26,27,28,29,30,31,32,33];
const GREEN=new Set([19,20,21,23,25,32]);

// ---- アガリ形（手牌の枚数が 3k+2 なら何枚でも判定できる）
function meldsOnly(c,i=0){
  while(i<34&&!c[i])i++;
  if(i===34)return true;
  if(c[i]>=3){c[i]-=3;const ok=meldsOnly(c,i);c[i]+=3;if(ok)return true;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const ok=meldsOnly(c,i);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true;}
  return false;
}
function canComplete(c,needPair){
  if(!needPair)return meldsOnly(c);
  for(let p=0;p<34;p++)if(c[p]>=2){c[p]-=2;const ok=meldsOnly(c);c[p]+=2;if(ok)return true;}
  return false;
}
const sumC=c=>c.reduce((s,x)=>s+x,0);
const isChiitoi=c=>sumC(c)===14&&c.filter(x=>x===2).length===7;
const isKokushi=c=>sumC(c)===14&&TH13.every(t=>c[t]>=1)&&TH13.reduce((s,t)=>s+c[t],0)===14;
const isAgariC=c=>sumC(c)%3===2&&(canComplete(c,true)||isChiitoi(c)||isKokushi(c));
function decompN(c,need){
  const res=[];
  for(let p=0;p<34;p++){
    if(c[p]<2)continue;
    c[p]-=2;const melds=[];
    (function rec(i){
      while(i<34&&c[i]===0)i++;
      if(i===34){if(melds.length===need)res.push({pair:p,melds:melds.slice()});return;}
      if(c[i]>=3){c[i]-=3;melds.push({type:'k',t:i});rec(i);melds.pop();c[i]+=3;}
      if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;melds.push({type:'s',t:i});rec(i);melds.pop();c[i]++;c[i+1]++;c[i+2]++;}
    })(0);
    c[p]+=2;
  }
  return res;
}
function waitsOf(c){
  const w=[];
  for(let t=0;t<34;t++){if(c[t]>=4)continue;c[t]++;if(isAgariC(c))w.push(t);c[t]--;}
  return w;
}

// ---- シャンテン数（F = 副露している面子の数）
const memo=new Map();
function blk(b,honor){
  const key=(honor?'h':'n')+b.join('');
  const hit=memo.get(key);if(hit)return hit;
  let i=0;while(i<b.length&&b[i]===0)i++;
  let res;
  if(i===b.length)res=[[0,0,0]];
  else{
    const out=new Map();
    const take=(rm,dm,dt,dp)=>{
      for(const [k,n] of rm)b[k]-=n;
      const sub=blk(b,honor);
      for(const [k,n] of rm)b[k]+=n;
      for(const [m,t,p] of sub){const np=p+dp;if(np>1)continue;const nm=Math.min(m+dm,4),nt=Math.min(t+dt,8);out.set(nm*100+nt*10+np,1);}
    };
    if(b[i]>=3)take([[i,3]],1,0,0);
    if(!honor&&i<=6&&b[i+1]&&b[i+2])take([[i,1],[i+1,1],[i+2,1]],1,0,0);
    if(b[i]>=2){take([[i,2]],0,0,1);take([[i,2]],0,1,0);}
    if(!honor&&i<=7&&b[i+1])take([[i,1],[i+1,1]],0,1,0);
    if(!honor&&i<=6&&b[i+2])take([[i,1],[i+2,1]],0,1,0);
    take([[i,1]],0,0,0);
    res=[...out.keys()].map(k=>[Math.floor(k/100),Math.floor(k/10)%10,k%10]);
  }
  memo.set(key,res);return res;
}
function shantenReg(c,F=0){
  const parts=[blk(c.slice(0,9),false),blk(c.slice(9,18),false),blk(c.slice(18,27),false),blk(c.slice(27),true)];
  let acc=[[0,0,0]];
  for(const part of parts){
    const nx=new Map();
    for(const [m,t,p] of acc)for(const [m2,t2,p2] of part){const np=p+p2;if(np>1)continue;const nm=Math.min(m+m2,4),nt=Math.min(t+t2,8);nx.set(nm*100+nt*10+np,[nm,nt,np]);}
    acc=[...nx.values()];
  }
  let best=8;for(const [m0,t,p] of acc){const m=Math.min(m0,4-F);const s=8-2*(m+F)-Math.min(t,4-m-F)-p;if(s<best)best=s;}
  return best;
}
function shantenChiitoi(c){let pr=0,k=0;for(const x of c){if(x>=1)k++;if(x>=2)pr++;}return 6-pr+Math.max(0,7-k);}
function shantenKokushi(c){let k=0,p=0;for(const t of TH13){if(c[t]>=1)k++;if(c[t]>=2)p=1;}return 13-k-p;}
function shanten(c,F=0){return F>0?shantenReg(c,F):Math.min(shantenReg(c,0),shantenChiitoi(c),shantenKokushi(c));}
function ukeire(c,s,vis,F=0){
  const tiles=[];let n=0;
  for(let t=0;t<34;t++){const left=4-vis[t];if(left<=0)continue;c[t]++;if(shanten(c,F)<s){tiles.push(t);n+=left;}c[t]--;}
  return {tiles,n};
}

// ---- 役（h = 門前の翻数、o = 鳴いたときの翻数。o:0 は門前限定）

  ippatsu:{n:'イッパツ',k:'一発',h:1,o:0,d:'リーチ後、誰かが鳴く前の一巡以内にアガる。'},
  tsumo:{n:'ツモ',k:'門前清自摸和',h:1,o:0,d:'門前のまま、自分で引いた牌でアガる。'},
  tanyao:{n:'タンヤオ',k:'断么九',h:1,o:1,d:'2〜8の数牌だけで作る。鳴いてもOK（喰いタン）。'},
  pinfu:{n:'ピンフ',k:'平和',h:1,o:0,d:'門前で、面子が全部順子、雀頭が役牌以外、待ちが両面。'},
  iipeiko:{n:'イーペーコー',k:'一盃口',h:1,o:0,d:'同じ種類・同じ数字の順子が2組。門前限定。'},
  haku:{n:'役牌（白）',k:'白',h:1,o:1,d:'白を3枚（ポンでもOK）。'},
  hatsu:{n:'役牌（發）',k:'發',h:1,o:1,d:'發を3枚（ポンでもOK）。'},
  chun:{n:'役牌（中）',k:'中',h:1,o:1,d:'中を3枚（ポンでもOK）。'},
  bakaze:{n:'役牌（場風）',k:'場風牌',h:1,o:1,d:'その局の場風（東場なら東）を3枚。'},
  jikaze:{n:'役牌（自風）',k:'自風牌',h:1,o:1,d:'自分の席の風を3枚。'},
  haitei:{n:'ハイテイ',k:'海底摸月',h:1,o:1,d:'山の最後の1枚でツモアガリ。'},
  houtei:{n:'ホウテイ',k:'河底撈魚',h:1,o:1,d:'最後の捨て牌でロンアガリ。'},

  ittsu:{n:'イッツー',k:'一気通貫',h:2,o:1,d:'同じ種類で123・456・789。鳴くと1翻。'},
  chanta:{n:'チャンタ',k:'混全帯么九',h:2,o:1,d:'全部の面子と雀頭に1・9・字牌が入る。鳴くと1翻。'},
  junchan:{n:'ジュンチャン',k:'純全帯么九',h:3,o:2,d:'全部の面子と雀頭に1か9が入る（字牌なし）。鳴くと2翻。'},
  toitoi:{n:'トイトイ',k:'対々和',h:2,o:2,d:'面子が4つとも刻子（ポン・カンでもOK）。'},
  sanankou:{n:'サンアンコー',k:'三暗刻',h:2,o:2,d:'自分でそろえた刻子（暗槓を含む）が3つ。ロンで完成した刻子は数えない。'},

function genRegular(o={}){

  const numT=()=>{const s=suits[rnd(suits.length)];let n;if(o.chanta)n=Math.random()<.5?0:8;else n=o.tanyao?1+rnd(7):rnd(9);return s*9+n;};

  const seqS=()=>{const s=suits[rnd(suits.length)];let n;if(o.chanta)n=Math.random()<.5?0:6;else n=o.tanyao?1+rnd(5):rnd(7);return s*9+n;};

    const c=new Array(34).fill(0),tiles=[];
    const add=ts=>{const tmp=counts(ts);for(let t=0;t<34;t++)if(c[t]+tmp[t]>4)return false;ts.forEach(t=>{c[t]++;tiles.push(t);});return true;};
    let ok=true;

// カンの仕込み：配牌・最初のツモ・嶺上牌の順番まで仕込む
function restackSpecial(hand13,force,rinOrder){

function pickDistinct(n,ok=()=>true){const out=[];const cand=shuffle([...Array(34).keys()]).filter(ok);for(const t of cand){if(out.length===n)break;out.push(t);}return out;}

  if(isAgariC(c))return -1;let m=9;for(const t of new Set(tiles)){c[t]--;m=Math.min(m,shanten(c,F));c[t]++;}return m;
}

function canKyuushu(i){const P=G.players[i],K=G.k;if(G.n<2||P.drawn==null||K.calls>0||P.river.length>0)return false;const c=counts([...P.hand,P.drawn]);return TH13.filter(t=>c[t]>0).length>=9;}
function callOptions(j,t,from){
  const P=G.players[j],K=G.k;if(P.riichi||K.wall.length===0)return null;

    [[t-2,t-1],[t-1,t+1],[t+1,t+2]].forEach(p=>{if(ok(p[0])&&ok(p[1])&&p[0]!==p[1])o.chi.push(p);});

// ---------- 進行
function startPlay(){const K=G.k;K.phase='cpu';S.sel=null;K.msg='';if(S.tab==='stack')S.tab='swap';drawFor(G.dealer);}
function revealKanDora(){const K=G.k;K.kans++;K.nDora=Math.min(5,K.nDora+1);if(K.wall.length)(K.extraDead=K.extraDead||[]).push(K.wall.shift());}
function drawFor(i,rinshan=false){
  const K=G.k,P=G.players[i];
  if(!rinshan&&K.wall.length===0)return ryukyoku();
  if(!rinshan)tickDraw();
  let t=null;
  if(rinshan)t=K.rinshan.pop();
  else{
    if(P.pray){P.pray=false;const ft=prayerTile(i);if(ft!=null)K.force[i]=ft;}
    if(K.force[i]!=null){const f=K.force[i];delete K.force[i];const idx=[];K.wall.forEach((x,j)=>{if(x===f)idx.push(j)});if(idx.length){K.wall.splice(idx[rnd(idx.length)],1);t=f;}}
    if(t==null)t=K.wall.pop();
  }
  P.drawn=t;K.turn=i;K.rinshanDraw=rinshan;
  if(i===0){if(!rinshan)K.draws++;K.phase='me';S.sel=null;S.rPending=false;S.best=null;K.msg=rinshan?'嶺上牌をツモった。':'';render();return;}
  if(isRemote(i)){K.phase='remote';K.waitSince=Date.now();render();return;}
  K.phase='cpu';render();schedule(()=>cpuAct(i),480);
}
function kuikaeFor(kind,t,tiles){

  const out=[t];
  if(t===tiles[0]&&t%9<=5)out.push(t+3);
  if(t===tiles[2]&&t%9>=3)out.push(t-3);
  return out;
}
function doDiscard(i,key){
  const P=G.players[i],K=G.k;let t;
  if(key==='d')t=P.drawn;else{t=P.hand[key];P.hand.splice(key,1);if(P.drawn!=null)P.hand.push(P.drawn);}
  P.hand=sortT(P.hand);P.drawn=null;P.kuikae=[];
  const decl=i===0?S.rPending:P._decl;
  if(P.riichi&&!decl)P.ippatsu=false;
  P.river.push({t,r:decl});
  P._pending=decl;
  if(i===0){S.rPending=false;S.sel=null;S.best=null;if(!P.riichi)P.skip=false;K.note='';}
  else if(!P.riichi)P.skip=false;
  K.last={i,t};K.rinshanDraw=false;
  if(P.noteDebt>0){const pay=Math.min(25,P.noteDebt,P.gauge||0);P.gauge-=pay;P.noteDebt-=pay;}
  if(G.curse)G.curse.left--;

  afterDiscard(i,t,1);
}
function afterDiscard(i,t,step){
  const n=G.n,K=G.k;
  for(let s=step;s<n;s++){
    const j=(i+s)%n;if(G.mode==='odai'&&j!==0)continue;const info=ronInfo(j,t);

      if(info.ok){K.phase='ron';K.ron={from:i,t,step:s,kind:'discard'};render();return;}

      seatNote(j,`${tileName(t)}でアガリ形だけど、${info.furi?'フリテン':'役がない'}からロンできない。`);
    }else if(info.ok)return win(j,i,[...G.players[j].hand,t],t,info.res,info.ctx);

function finalizeRiichi(i){

  P.riichi=true;P.ippatsu=true;P.double=K.calls===0&&P.river.length===1;

function callPhase(i,t){
  const K=G.k,n=G.n;

  if(K.wall.length===0||n===1)return nextTurn(i);
  let cpuPon=null;
  if(G.mode!=='odai')for(let s=1;s<n;s++){const j=(i+s)%n;if(isHum(j))continue;const d=cpuPonDecision(j,t);if(d){cpuPon={j,...d};break;}}
  // 鳴ける人間を順番に聞く（ポン・カンできる人が先）
  const queue=[];
  for(let s=1;s<n;s++){const j=(i+s)%n;if(!isHum(j)||G.players[j].dead)continue;if(j===0&&S.callMode!=='ask')continue;
    const o=callOptions(j,t,i);if(!o)continue;const oo={...o,chi:cpuPon?[]:o.chi};if(oo.pon||oo.kan||oo.chi.length)queue.push({seat:j,opts:oo});}

  if(C.cpuPon)return doCall(C.cpuPon.j,C.from,C.t,C.cpuPon.kind,C.cpuPon.use);

function seatNote(i,msg){const K=G.k;if(i===0){K.note=msg;return;}K.notes=K.notes||{};K.notes[i]={msg,at:Date.now()};}

function doCall(j,from,t,kind,use){

function doKakan(i,t){

// ---------- CPU
function isYakuhaiT(j,t){return t>=31||t===seatWind(j)||t===roundWind();}
function hasOpenYakuPath(j,extraT){
  const P=G.players[j];
  if(P.melds.some(m=>m.kind!=='chi'&&isYakuhaiT(j,m.t)))return true;
  if(extraT!=null&&isYakuhaiT(j,extraT))return true;
  const all=allTilesOf(P,extraT);
  const th=all.filter(isTH).length;
  if(th<=1&&P.melds.every(m=>meldTiles(m).every(x=>!isTH(x)))&&(extraT==null||!isTH(extraT)))return true;
  const suits=new Set(all.filter(x=>x<27).map(x=>Math.floor(x/9)));
  if(suits.size===1&&all.filter(x=>x<27).length>=all.length-3)return true;
  return false;
}
function bestAfterCall(P,c2,F){let best=9;for(let x=0;x<34;x++){if(!c2[x])continue;c2[x]--;best=Math.min(best,shanten(c2,F));c2[x]++;}return best;}
function cpuPonDecision(j,t){
  const P=G.players[j],K=G.k;if(P.riichi||K.wall.length===0)return null;
  const c=counts(P.hand);if(c[t]<2)return null;
  const F=FF(P);const cur=shanten(c,F);
  if(c[t]>=3&&t>=27&&K.kans<4&&!isMenzen(P))return {kind:'minkan',use:[t,t,t]};
  const c2=c.slice();c2[t]-=2;const best=bestAfterCall(P,c2,F+1);
  if(isYakuhaiT(j,t)&&best<=cur)return {kind:'pon',use:[t,t]};
  if(best<cur&&hasOpenYakuPath(j,t)&&cur<=3)return {kind:'pon',use:[t,t]};
  return null;
}
function cpuChiDecision(j,t,from){
  const P=G.players[j];const o=callOptions(j,t,from);if(!o||!o.chi.length)return null;
  const c=counts(P.hand);const F=FF(P);const cur=shanten(c,F);
  if(!hasOpenYakuPath(j,t)||cur>3)return null;
  let best=null;
  for(const p of o.chi){const c2=c.slice();c2[p[0]]--;c2[p[1]]--;const s=bestAfterCall(P,c2,F+1);if(s<cur&&(!best||s<best.s))best={s,use:p};}
  return best?{use:best.use}:null;
}
function danger(i,t){
  let d=0;
  G.players.forEach((p,j)=>{if(j===i||!p.riichi)return;let v;if(p.river.some(r=>r.t===t))v=0;else if(t>=27)v=visibleFor(i)[t]>=3?.3:1.5;else if(t%9===0||t%9===8)v=2;else v=3;d=Math.max(d,v);});
  return d;
}
function chooseDiscard(i,tiles,banned){
  const P=G.players[i];const F=FF(P);const c=counts(tiles),vis=visibleFor(i),opts=[];
  let cand=[...new Set(tiles)];const ok=cand.filter(t=>!banned.includes(t));if(ok.length)cand=ok;
  for(const t of cand){c[t]--;const s=shanten(c,F);const uk=ukeire(c,s,vis,F);c[t]++;opts.push({t,s,n:uk.n,dg:danger(i,t)});}
  const minS=Math.min(...opts.map(o=>o.s));
  const threat=G.players.some((p,j)=>j!==i&&p.riichi);
  if(threat&&minS>=2)opts.sort((a,b)=>a.dg-b.dg||a.s-b.s||b.n-a.n);
  else opts.sort((a,b)=>a.s-b.s||b.n-a.n||(isTH(b.t)?1:0)-(isTH(a.t)?1:0));

// 相棒に頼んだ牌を捨てさせる（通し）
function requestedDiscard(i,pickT){
  const P=G.players[i],K=G.k;const t=K.req;
  if(t==null||P.riichi)return null;
  K.req=null;
  const mine=[...P.hand];if(P.drawn!=null)mine.push(P.drawn);
  if(mine.includes(t))return {t,swap:false};
  const idx=[];K.wall.forEach((x,j)=>{if(x===t)idx.push(j)});
  if(!idx.length){K.log.unshift(`${tileName(t)}はもう山に残っていなかった。`);return null;}
  K.wall.splice(idx[rnd(idx.length)],1);
  // 本来捨てる予定だった牌を山に戻し、頼まれた牌に入れ替える
  if(P.drawn===pickT)P.drawn=t;else{P.hand[P.hand.indexOf(pickT)]=t;}
  K.wall.splice(rnd(K.wall.length+1),0,pickT);
  return {t,swap:true};
}
function cpuPracticeAct(i){
  const P=G.players[i];P._decl=false;
  const tiles=[...P.hand];if(P.drawn!=null)tiles.push(P.drawn);
  let pick=chooseDiscard(i,tiles,P.kuikae||[]).t;
  const rq=requestedDiscard(i,pick);if(rq)pick=rq.t;
  doDiscard(i,P.drawn===pick?'d':P.hand.indexOf(pick));
}
function cpuAct(i){
  if(G.mode==='odai')return cpuPracticeAct(i);
  if(cpuMaybeCheat(i)&&(G.wolf||G.k.phase!=='cpu'))return;
  const P=G.players[i],K=G.k;const tiles=[...P.hand,P.drawn];
  if(isAgariC(counts(tiles))){const ctx=tsumoCtx(i);const res=evalWin(tiles,P.drawn,ctx);if(res&&res.yaku.length)return win(i,null,tiles,P.drawn,res,ctx);}
  P._decl=false;
  const ko=kanOptions(i);
  for(const o of ko){
    if(o.kind==='kakan')return doKakan(i,o.t);
    if(o.kind==='ankan'){
      if(P.riichi)return doAnkan(i,o.t);
      const F=FF(P);const cur=shantenAny(tiles,F);const rest=tiles.filter(x=>x!==o.t);
      if(shantenAny(rest,F+1)<=cur)return doAnkan(i,o.t);
    }

  if(P.riichi)return doDiscard(i,'d');
  const pick=chooseDiscard(i,tiles,[]);
  const rq=requestedDiscard(i,pick.t);
  if(rq){P._decl=false;return doDiscard(i,rq.t===P.drawn?'d':P.hand.indexOf(rq.t));}
  P._decl=isMenzen(P)&&pick.s===0&&K.wall.length>=4&&P.pts>=1000;
  doDiscard(i,pick.t===P.drawn?'d':P.hand.indexOf(pick.t));
}
function cpuDiscardAfterCall(i){
  const P=G.players[i];P._decl=false;

  const rq=requestedDiscard(i,pick);if(rq&&!P.kuikae.includes(rq.t))pick=rq.t;

// ---------- 点数
function calcFu(res,tsumo,ctx){
  if(res.kokushi)return 0;
  if(res.chiitoi)return 25;
  if(res.yaku.includes('pinfu'))return tsumo?20:30;
  let fu=20;if(res.menzen&&!tsumo)fu+=10;if(tsumo)fu+=2;
  res.ms.forEach(m=>{if(m.type!=='k')return;let b=isTH(m.t)?4:2;if(m.ankou)b*=2;if(m.kan)b*=4;fu+=b;});
  const p=res.pair;if(p>=31)fu+=2;if(p===ctx.seat)fu+=2;if(p===ctx.round)fu+=2;
  if(['kanchan','penchan','tanki'].includes(res.wait))fu+=2;
  fu=Math.ceil(fu/10)*10;if(!res.menzen&&fu<30)fu=30;
  return fu;
}
function scoreOf(res,allT,wi,tsumo,ctx){
  const isD=wi===G.dealer;const ym=ymCount(res);
  let dora=0,ura=0,fu=0,han=0,base,limit='';
  if(ym){base=8000*ym;limit=ym>1?`${ym}倍役満`:'役満';if(G.k&&G.k.event&&G.k.event.k==='kimagure'){base*=2;limit+='（店長の気まぐれで2倍）';}}
  else{
    doraInds().forEach(ind=>{const d=doraOf(ind);dora+=allT.filter(t=>t===d).length;});
    if(ctx.riichi)uraInds().forEach(ind=>{const d=doraOf(ind);ura+=allT.filter(t=>t===d).length;});
    han=res.han+dora+ura;fu=calcFu(res,tsumo,ctx);base=fu*Math.pow(2,han+2);
    if(han>=13){base=8000;limit='数え役満';}else if(han>=11){base=6000;limit='三倍満';}else if(han>=8){base=4000;limit='倍満';}else if(han>=6){base=3000;limit='跳満';}else if(han>=5||base>=2000){base=2000;limit='満貫';}
  }
  const up=x=>Math.ceil(x/100)*100;
  const ron=up(base*(isD?6:4)),tsD=up(base*2),tsC=up(base);
  const total=!tsumo||G.n===2?ron:(isD?tsD*3:tsD+tsC*2);
  return {dora,ura,fu,han,limit,ron,tsD,tsC,total,isD,ym,base};
}
function win(wi,from,conc,wt,res,ctx){
  const K=G.k,tsumo=from==null,P=G.players[wi];
  const allT=conc.slice();P.melds.forEach(m=>allT.push(...meldTiles(m)));
  const sc=scoreOf(res,allT,wi,tsumo,ctx);
  const pay=G.players.map(()=>0),hb=G.honba,kyo=G.mode!=='odai'?G.kyotaku:0;
  if(G.mode!=='odai'){
    if(!tsumo){pay[from]-=sc.ron+hb*300;pay[wi]+=sc.ron+hb*300;}
    else if(G.n===2){const o=1-wi;pay[o]-=sc.ron+hb*300;pay[wi]+=sc.ron+hb*300;}
    else G.players.forEach((p,i)=>{if(i===wi)return;const a=(i===G.dealer||wi===G.dealer?sc.tsD:sc.tsC)+hb*100;pay[i]-=a;pay[wi]+=a;});
    pay[wi]+=G.kyotaku*1000;G.kyotaku=0;
    if(!tsumo)addGauge(from,25);
    G.players.forEach((p,i)=>p.pts+=pay[i]);
  }
  K.result={type:'win',wi,from,wt,res,sc,pay,tsumo,hand13:sortT(conc.slice(0,-1)),melds:P.melds.map(m=>({...m})),inds:doraInds(),uras:ctx.riichi?uraInds():[],ctx,hb:G.mode!=='odai'?hb:0,kyo};
  K.phase='end';S.sel=null;S.peek=false;
  if(wi===0){rec.wins++;if(sc.ym)rec.yakuman++;if(sc.total>rec.best)rec.best=sc.total;if(isParty()){if(sc.ym)bumpCnt('ym');if(P.tsubameHand)bumpCnt('tsubameWin');if(P.kamiHand&&sc.ym)bumpCnt('kamiWin');}}
  say(wi,'win');if(from!=null)say(from,'lose');

  if(G.mode!=='odai')startCutin(wi,K.result);
  if(G.mode==='odai'){const ok=wi===0&&hit(res,G.target);K.result.odaiOk=ok;if(ok&&!rec.cleared.includes(G.target))rec.cleared.push(G.target);}
  persist();render();
}
function ryukyoku(){

// ---------- イカサマ
function myBase(){const P=G.players[0];return P.drawn!=null?[...P.hand,P.drawn]:P.hand.slice();}
function doSwap(t){
  const P=G.players[0],K=G.k,key=S.sel;if(key==null)return;
  const idx=[];K.wall.forEach((x,j)=>{if(x===t)idx.push(j)});if(!idx.length)return;
  K.wall.splice(idx[rnd(idx.length)],1);
  let old;
  if(key==='d'){old=P.drawn;P.drawn=t;}else{old=P.hand[+key];P.hand[+key]=t;P.hand=sortT(P.hand);}
  K.wall.splice(rnd(K.wall.length+1),0,old);
  S.sel=null;S.best=null;
  K.msg=`<span class="t">${tileName(old)}</span>を<span class="t">${tileName(t)}</span>にすり替えた。`;
}
function swapOptions(){
  const P=G.players[0],K=G.k,key=S.sel;if(key==null)return null;
  const base=myBase();const F=FF(P);
  const idx=key==='d'?base.length-1:+key;
  const wc=counts(K.wall);const cur=shantenAny(base,F);
  const canWin=K.phase==='me'&&P.drawn!=null;
  return [...Array(34).keys()].map(t=>{
    if(!wc[t]||t===base[idx])return {t,n:wc[t],skip:true};
    const nb=base.slice();nb[idx]=t;
    if(canWin&&isAgariC(counts(nb))){const r=evalWin(nb,key==='d'?t:P.drawn,tsumoCtx(0));if(r&&r.yaku.length)return {t,n:wc[t],win:r};}
    return {t,n:wc[t],up:shantenAny(nb,F)<cur};
  });
}
function findBest(){
  const P=G.players[0];if(P.drawn==null){S.best={none:true};return;}
  const base=[...P.hand,P.drawn];const wc=counts(G.k.wall);let best=null;const odai=G.mode==='odai';
  base.forEach((old,idx)=>{
    if(idx>0&&idx<base.length-1&&base[idx]===base[idx-1])return;
    for(let t=0;t<34;t++){
      if(!wc[t]||t===old)continue;
      const nb=base.slice();nb[idx]=t;if(!isAgariC(counts(nb)))continue;
      const ctx=tsumoCtx(0);const wt=idx===base.length-1?t:P.drawn;const r=evalWin(nb,wt,ctx);if(!r||!r.yaku.length)continue;
      const allT=nb.slice();P.melds.forEach(m=>allT.push(...meldTiles(m)));
      const sc=scoreOf(r,allT,0,true,ctx);const h=odai&&hit(r,G.target)?1:0;
      if(!best||h>best.h||(h===best.h&&sc.total>best.sc.total))best={key:idx===base.length-1?'d':String(idx),old,t,r,sc,h};
    }
  });
  S.best=best||{none:true};
}

function canUse(i,key,ignoreGauge){

// ---- 燕返し・役満の神様：配牌を仕込み直す
function genForSeat(key,i){
  const ctx={round:roundWind(),seat:seatWind(i),tsumo:false,riichi:false,melds:[]};
  for(let a=0;a<120;a++){
    const tiles=GEN[key]();if(!tiles||tiles.length!==14)continue;
    for(const w of shuffle([...new Set(tiles)])){const r=evaluate(tiles,w,ctx);if(r&&hit(r,key)){const h=tiles.slice();h.splice(h.indexOf(w),1);return {hand:sortT(h),win:w};}}
  }
  return null;
}
function stackSeat(i,key){
  const P=G.players[i],K=G.k;if(P.melds.length)return null;
  const pool=counts([...K.wall,...P.hand]);
  for(let a=0;a<30;a++){
    const g=genForSeat(key,i);if(!g)continue;
    const c=counts(g.hand);if(c.some((x,t)=>x>pool[t]))continue;
    P.hand.forEach(putToWall);g.hand.forEach(takeFromWall);P.hand=sortT(g.hand);
    return {key,ws:waitsOf(counts(P.hand))};
  }
  return null;
}
const YM_KEYS=['kokushi','daisangen','suuankou','tsuuiisou','ryuuiisou','chinroutou','chuuren','shousuushii','daisuushii'];
// 役満までのだいたいの距離（入れ替えが必要な枚数のめやす）
function ymDistances(tiles){
  const c=counts(tiles);const out=[];
  out.push({k:'kokushi',d:shantenKokushi(c)+1});
  out.push({k:'daisangen',d:[31,32,33].reduce((s,t)=>s+Math.max(0,3-c[t]),0)});
  const top=c.map(x=>Math.min(x,3)).sort((a,b)=>b-a).slice(0,5);
  out.push({k:'suuankou',d:(3-top[0])+(3-top[1])+(3-top[2])+(3-top[3])+Math.max(0,2-top[4])});
  out.push({k:'tsuuiisou',d:tiles.filter(t=>t<27).length});
  out.push({k:'ryuuiisou',d:tiles.filter(t=>!GREEN.has(t)).length});
  out.push({k:'chinroutou',d:tiles.filter(t=>!(t<27&&(t%9===0||t%9===8))).length});
  let ch=99;for(let s=0;s<3;s++){let need=0;const base=[3,1,1,1,1,1,1,1,3];for(let k=0;k<9;k++)need+=Math.max(0,base[k]-c[s*9+k]);const other=tiles.filter(t=>t>=27||Math.floor(t/9)!==s).length;ch=Math.min(ch,Math.max(need,other));}
  out.push({k:'chuuren',d:ch});
  const wd=[27,28,29,30].map(t=>Math.min(c[t],3)).sort((a,b)=>b-a);
  out.push({k:'shousuushii',d:(3-wd[0])+(3-wd[1])+(3-wd[2])+Math.max(0,2-wd[3])});
  out.push({k:'daisuushii',d:wd.reduce((s,x)=>s+3-x,0)});
  return out.sort((a,b)=>a.d-b.d);
}

// ---- 1枚交換でいちばん良くなる手（UFO のプレビューと CPU 用）
function bestSwap(i){
  const P=G.players[i];if(P.drawn==null)return null;
  const base=[...P.hand,P.drawn];const F=FF(P);const wc=counts(G.k.wall);const cur=shantenAny(base,F);let best=null;
  base.forEach((old,idx)=>{
    if(idx>0&&idx<base.length-1&&base[idx]===base[idx-1])return;
    const key=idx===base.length-1?'d':String(idx);
    for(let t=0;t<34;t++){
      if(!wc[t]||t===old)continue;
      const nb=base.slice();nb[idx]=t;
      if(isAgariC(counts(nb))){
        const ctx=tsumoCtx(i);const r=evalWin(nb,key==='d'?t:P.drawn,ctx);
        if(r&&r.yaku.length){const allT=nb.slice();P.melds.forEach(m=>allT.push(...meldTiles(m)));const sc=scoreOf(r,allT,i,true,ctx);const score=1e6+sc.total;if(!best||score>best.score)best={key,old,t,win:{r,sc},score};continue;}
      }
      const s=shantenAny(nb,F);if(s>=cur)continue;const score=(cur-s)*1000-s;if(!best||score>best.score)best={key,old,t,s,score};
    }
  });
  return best;
}
// 祈り：次のツモで来る牌を決める
function prayerTile(i){
  const P=G.players[i],K=G.k;const c=counts(P.hand);const wc=counts(K.wall);const F=FF(P);
  const ws=waitsOf(c.slice()).filter(t=>wc[t]>0);
  if(ws.length){
    let best=null;
    for(const w of ws){const tiles=[...P.hand,w];const r=evalWin(tiles,w,tsumoCtx(i));const v=r&&r.yaku.length?resScore(r):-1;if(!best||v>best.v)best={w,v};}
    return best.w;
  }
  const s=shanten(c,F);let best=null;
  for(let t=0;t<34;t++){if(!wc[t])continue;c[t]++;const s2=shantenAny([...expand(c)],F);c[t]--;if(s2<s&&(!best||s2<best.s||(s2===best.s&&wc[t]>best.n)))best={t,s:s2,n:wc[t]};}
  return best?best.t:null;
}
function nextSeat(i){
  const K=G.k;let j=(i+1)%G.n;let guard=0;
  while(guard++<8&&(G.players[j].dead||(K.skip&&K.skip.has(j)))){if(K.skip)K.skip.delete(j);j=(j+1)%G.n;}
  return j;
}

// ---- CPU もイカサマを使う
const cu=(i,k,p)=>{const e=useCheat(i,k,p);return e==null||e==='pending';};
function cpuGenkotsuPlan(i,j){
  const P=G.players[i],T=G.players[j];const n=Math.min(maxTake(i),T.hand.length,P.hand.length);if(!n)return null;
  const own=[...P.hand,P.drawn];
  const near=t=>own.filter(x=>x===t||(t<27&&x<27&&Math.floor(x/9)===Math.floor(t/9)&&Math.abs(x-t)<=2)).length;
  const takes=T.hand.map((t,ix)=>({ix,v:near(t)+(t>=31?1:0)})).sort((a,b)=>b.v-a.v).slice(0,n).map(o=>o.ix);
  const keys=[];
  for(let k=0;k<n;k++){
    const rest=P.hand.map((t,ix)=>ix).filter(ix=>!keys.includes(String(ix)));
    const pick=chooseDiscard(i,rest.map(ix=>P.hand[ix]),[]).t;
    keys.push(String(rest.find(q=>P.hand[q]===pick)));
  }
  return {target:j,takes,gives:keys};
}
function cpuIyagarasePlan(j){
  const T=G.players[j],K=G.k;const wc=counts(K.wall);const F=FF(T);const cur=shanten(counts(T.hand),F);
  const junk=[27,28,29,30,31,32,33,0,8,9,17,18,26].filter(x=>wc[x]&&!T.hand.includes(x));if(!junk.length)return null;
  let best=null;T.hand.forEach((t,ix)=>{const x=junk[rnd(junk.length)];const h=T.hand.slice();h[ix]=x;const s=shanten(counts(h),F);if(!best||s>best.s)best={ix,t:x,s};});
  return best&&best.s>=cur?{target:j,ix:best.ix,t:best.t}:null;
}
function cpuMaybeCheat(i){
  if(!S.cpuCheat)return false;
  const P=G.players[i];if(P.riichi||P.drawn==null)return false;
  if(P._cheated){P._cheated=false;return false;}
  if(patrolActive()&&Math.random()<0.85)return false;
  if(isAgariC(counts([...P.hand,P.drawn])))return false;
  const g=P.gauge||0,r=Math.random();
  const ok=k=>canUse(i,k).ok;
  if(ok('note')&&isLast(i)){const lead=alive().filter(j=>j!==i).sort((a,b)=>G.players[b].pts-G.players[a].pts)[0];if(G.players[lead].pts-P.pts>=15000&&r<0.25){
    const fc=alive().filter(j=>j!==i&&j!==lead);const frame=S.opts.noteFrame&&fc.length&&Math.random()<0.7?(fc.includes(0)&&Math.random()<0.5?0:fc[rnd(fc.length)]):null;
    useCheat(i,'note',{target:lead,frame});return true;}}
  if(ok('kami')&&r<0.6)return cu(i,'kami',{});
  if(ok('tsubame')&&r<0.35){const y=['honitsu','chinitsu','sanshoku','ittsu','toitoi','yakuhai','chiitoi'][rnd(7)];return cu(i,'tsubame',{yaku:y});}
  const rch=alive().find(j=>j!==i&&G.players[j].riichi);
  if(rch!=null&&ok('toki')&&r<0.35)return cu(i,'toki',{target:rch});
  if(g>=30&&ok('ufo')){const b=bestSwap(i);if(b&&((b.win&&r<0.9)||(!b.win&&r<0.3)))return cu(i,'ufo',{key:b.key,t:b.t});}
  const leader=alive().filter(j=>j!==i).sort((a,b)=>G.players[b].pts-G.players[a].pts)[0];
  if(leader!=null&&ok('genkotsu')&&r<0.22){const plan=cpuGenkotsuPlan(i,leader);if(plan)return cu(i,'genkotsu',plan);}
  if(ok('iyagarase')&&r<0.16){const tg=alive().filter(j=>j!==i&&(G.players[j].riichi||shanten(counts(G.players[j].hand),FF(G.players[j]))<=1));const j=tg.length?tg[rnd(tg.length)]:leader;if(j!=null){const plan=cpuIyagarasePlan(j);if(plan)return cu(i,'iyagarase',plan);}}
  if(leader!=null&&ok('suberi')&&r<0.18){const pick=chooseDiscard(i,[...P.hand,P.drawn],[]).t;const key=P.drawn===pick?'d':String(P.hand.indexOf(pick));return cu(i,'suberi',{key,target:leader});}
  if(g>=50&&r<0.12){const k=['daipan','neko','demae'][rnd(3)];if(ok(k)){const pick=chooseDiscard(i,[...P.hand,P.drawn],[]).t;const key=P.drawn===pick?'d':String(P.hand.indexOf(pick));return cu(i,k,{key});}}
  if(g>=40&&r<0.08&&ok('inori'))return cu(i,'inori',{});
  return false;
}

function startWerewolf(writer,victim,frame=null){

function cpuWolfVote(i){
  const W=G.wolf;const cands=G.players.map((p,j)=>j).filter(j=>j!==i&&j!==W.victim);
  const tantei=G.players[i].char==='tantei';

  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let k=0;k<cands.length;k++){r-=w[k];if(r<=0)return cands[k];}

function wolfVoters(){const W=G.wolf;return G.players.map((p,i)=>i).filter(i=>i!==W.victim&&!G.players[i].dead&&isHum(i));}
function wolfVote(t){wolfVoteBy(0,t);}
function wolfVoteBy(s,t){
  const W=G.wolf;if(!W||W.stage==='result'||s===W.victim||t===s||t===W.victim||!G.players[t])return;
  W.votes[s]=t;
  G.players.forEach((p,i)=>{if(i!==W.victim&&!p.dead&&!isHum(i)&&W.votes[i]==null)W.votes[i]=cpuWolfVote(i);});

}
function finishWolf(){
  const W=G.wolf;const tally={};Object.values(W.votes).forEach(t=>tally[t]=(tally[t]||0)+1);
  const top=Math.max(0,...Object.values(tally));const tops=Object.keys(tally).filter(k=>tally[k]===top).map(Number);
  W.tally=tally;W.caught=tops.length===1&&tops[0]===W.writer;W.stage='result';
  if(W.votes[0]===W.writer)bumpCnt('detect');if(W.writer===0&&!W.caught)bumpCnt('escape');
  const byPts=(a,b)=>G.players[b].pts-G.players[a].pts;
  const ids=G.players.map((p,i)=>i);
  G.finalRank=W.caught?ids.filter(i=>i!==W.writer).sort(byPts).concat([W.writer]):[W.writer].concat(ids.filter(i=>i!==W.writer&&i!==W.victim).sort(byPts),[W.victim]);

function patrolActive(){const K=G.k;return !!(K&&K.patrol&&(K.totalDraws||0)<=K.patrol.until);}
function tickDraw(){
  const K=G.k;K.totalDraws=(K.totalDraws||0)+1;

  if(K.event&&K.event.k==='jishin'&&K.totalDraws===K.quakeAt)quake();

let counterTok=0;
function doCountered(i,v,key){
  const A=G.players[i],V=G.players[v];
  A.pts-=2000;V.pts+=2000;V.gauge=Math.max(0,(V.gauge||0)-30);
  const tok=++annToken;S.ann={who:V.name,name:'お見通しだ！',text:`${A.name}の「${CHEATS[key].n}」を返り討ち。${A.name}が2000点払った。`,key:'counter',tok};

  setTimeout(()=>{if(S.ann&&S.ann.tok===tok){S.ann=null;render();}},2000);
  say(v,'counter');say(i,'hit');if(v===0)bumpCnt('counter');
}
function startCounter(i,key,p,cost){
  const K=G.k;G.players[i].gauge-=cost;
  const tok=++counterTok;const target=p.target;const ms=target===0?3000:4500;
  K.pendingCounter={i,target,key,p:{...p,noCounter:true,prepaid:true},until:Date.now()+ms,tok};
  K.phase=target===0?'counter':'rcounter';say(i,'cheat');
  const g=gen;
  setTimeout(()=>{if(g===gen&&G.k.pendingCounter&&G.k.pendingCounter.tok===tok)resolveCounter(false);},ms);
  const tick=()=>{if(g===gen&&G.k.pendingCounter&&G.k.pendingCounter.tok===tok){render();setTimeout(tick,500);}};setTimeout(tick,500);
  render();
}
function resolveCounter(countered){
  const K=G.k,PC=K.pendingCounter;if(!PC)return;K.pendingCounter=null;K.phase='cpu';
  const T=PC.target==null?0:PC.target;
  if(countered&&(G.players[T].gauge||0)>=30)doCountered(PC.i,T,PC.key);
  else{const e=useCheat(PC.i,PC.key,PC.p);if(!e)say(T,'hit');}
  if(G.wolf)return;
  if(isHum(PC.i)){K.phase=turnPhase(PC.i);K.waitSince=Date.now();render();return;}
  G.players[PC.i]._cheated=true;render();
  schedule(()=>cpuAct(PC.i),350);
}

function myAnalysis(){
  const P=G.players[0];const F=FF(P);
  const tiles=myBase();const c=counts(tiles);
  let agari=false,res=null;
  if(P.drawn!=null&&isAgariC(c)){res=evalWin(tiles,P.drawn,tsumoCtx(0));agari=!!res;}
  const opts=new Map();
  for(const t of new Set(tiles)){c[t]--;opts.set(t,shanten(c,F));c[t]++;}

    const tiles=m.type==='s'?[m.t,m.t+1,m.t+2]:Array(m.kan?4:3).fill(m.t);
    const label=m.src==='f'?(m.kan?(m.called?'明槓':'暗槓'):(m.type==='s'?'チー':'ポン')):(m.type==='s'?'順子':'刻子');
    return {tiles,label,win:m.src==='c'&&m.i===res.slot?tiles.indexOf(w):-1};
  });
  gs.push({tiles:[res.pair,res.pair],label:'雀頭',win:res.slot===-1?1:-1});

}

  pickchar:el=>{S.myChar=el.dataset.k;const m=S.charPick;S.charPick=null;startGame(m);return 'skip';},

    if(k==='nidomi'){const b=(S.navi||naviData()).river;if(!b)return;S.sel=b.key;return H.cdo({dataset:{o:String(b.o),ix:String(b.ix)}});}
    if(k==='iyagarase'&&S.ctarget!=null){const pl=iyaPlan(S.ctarget);if(!pl)return;S.ctakes=[pl.ix];return H.cdo({dataset:{t:String(pl.t)}});}
  },

  'dr-apply':()=>{if(S.draft.length!==13)return;restack(S.draft.slice(),null);G.k.stackInfo=null;const ws=waitsOf(counts(S.draft));G.k.msg=`自分で並べた配牌にした。${ws.length?`待ちは <b>${ws.map(tileName).join('・')}</b>。`:''}`;},
  hand:el=>{

// ================= イカサマパネル（ゲージ式）・ナビ・人狼の画面 =================
const SEL_CHEATS=['ufo','nidomi','suberi','daipan'];
function gaugeBar(g,cls=''){return `<span class="gbar ${cls}" title="イカサマゲージ ${g}/100"><i style="width:${Math.max(0,Math.min(100,g))}%"></i></span>`;}
function naviData(){
  const K=G.k,me=G.players[0];
  const base=myBase();const sig=`${K.draws}|${K.wall.length}|${base.join(',')}|${me.melds.length}`;
  if(S.navi&&S.navi.sig===sig)return S.navi;
  const F=FF(me);const s=shantenAny(base,F);
  const d={sig,s,ym:me.melds.length?null:ymDistances(base)[0],best:null,pick:null,waits:[]};
  if(K.phase==='me'&&me.drawn!=null){
    d.pick=chooseDiscard(0,base,me.kuikae||[]).t;
    if((me.gauge||0)>=cheatCost(0,'ufo'))d.best=bestSwap(0);
    if(canUse(0,'nidomi').ok)d.river=bestRiverPick();
  }else d.waits=waitsOf(counts(me.hand));
  S.navi=d;return d;
}
function naviHTML(){
  if(!S.opts.callNavi)return '';
  const K=G.k,me=G.players[0];if(K.phase==='end'||K.phase==='wolf'||K.phase==='deal')return '';
  const d=naviData();
  const head=d.s<0?'<b>アガリの形！</b> ツモを押そう':d.s===0?'<b>テンパイ</b>（あと1枚でアガリ）':`アガリまで あと<b>${d.s+1}</b>枚`;
  const rows=[`<li>${head}</li>`];
  if(d.pick!=null&&d.s>=0)rows.push(`<li>おすすめの捨て牌：<span class="mt">${tileHTML(d.pick,{label:false})}</span>${tileName(d.pick)}</li>`);
  if(d.waits.length)rows.push(`<li>待ち：${d.waits.map(tileName).join('・')}</li>`);
  if(me.char==='uranai'&&K.phase==='me'&&K.wall.length){const nx=K.force[0]!=null?K.force[0]:K.wall[Math.max(0,K.wall.length-alive().length+(K.phase==='me'?0:(K.turn===0?0:0)))];if(nx!=null)rows.push(`<li>占い：次のツモはたぶん <span class="mt">${tileHTML(nx,{label:false})}</span>${tileName(nx)}</li>`);}
  if(d.ym)rows.push(`<li>いちばん近い役満：<b>${yk(d.ym.k)}</b>　あと約${d.ym.d}枚${isLast(0)?'　<span class="hl">最下位なので「役満の神様」が使える</span>':''}</li>`);
  if(d.best){
    if(d.best.win)rows.push(`<li class="hl">UFOで ${tileName(d.best.old)} を <b>${tileName(d.best.t)}</b> にすると、ツモ：${d.best.win.r.yaku.map(yakuName).join('・')}　<b>${d.best.win.sc.total.toLocaleString()}点</b></li>`);
    else rows.push(`<li>UFOで ${tileName(d.best.old)} を <b>${tileName(d.best.t)}</b> にすると、${d.best.s===0?'テンパイ':`あと${d.best.s+1}枚`}になる</li>`);
  }
  return `<div class="navi"><div class="grp-t">ナビ</div><ul>${rows.join('')}</ul></div>`;
}
function bestRiverPick(){
  const me=G.players[0];const base=myBase();const F=FF(me);const cur=shantenAny(base,F);let best=null;
  G.players.forEach((p,o)=>p.river.forEach((r,ix)=>{
    if(r.taken)return;
    base.forEach((old,bi)=>{
      if(bi>0&&bi<base.length-1&&base[bi]===base[bi-1])return;
      const nb=base.slice();nb[bi]=r.t;const s=shantenAny(nb,F);
      if(s<cur&&(!best||s<best.s))best={o,ix,t:r.t,old,s,key:bi===base.length-1?'d':String(bi)};
    });
  }));
  return best;
}
function cheatPreview(k){
  if(!S.opts.callNavi)return CHEATS[k].d;
  const me=G.players[0];const d=S.navi||naviData();
  const sw=b=>b?(b.win?`${tileName(b.old)}→${tileName(b.t)}でツモ ${b.win.sc.total.toLocaleString()}点`:`${tileName(b.old)}→${tileName(b.t)}で${b.s===0?'テンパイ':`あと${b.s+1}枚`}`):'';
  switch(k){
    case 'ufo':return sw(d.best)||'好きな牌を1枚持ってくる';
    case 'iyagarase':return '相手の手牌を見て、1枚を山の好きな牌に変える。テンパイ崩しに';
    case 'nidomi':return d.river?`${G.players[d.river.o].name}の${tileName(d.river.t)}を拾うと${d.river.s===0?'テンパイ':`あと${d.river.s+1}枚`}`:'河の牌を1枚拾う';
    case 'inori':return '切ったあとの待ち牌が、次のツモで来る';
    case 'suberi':return 'ランダムに1枚もらう。何が来るかはお楽しみ';
    case 'daipan':return 'テンパイしている人の手を崩せる';
    case 'neko':return me.char==='nekotsukai'?'猫の行き先を選べる':'ランダムな誰かの牌が河に落ちる';
    case 'demae':return 'みんなを1回休みにして、もう1回ツモれる';
    case 'genkotsu':return `相手の手牌を見て、${maxTake(0)}枚まで選んで奪える`;
    case 'toki':{const r=alive().filter(j=>j!==0&&G.players[j].riichi).map(j=>G.players[j].name);return `${r.join('・')}のリーチを消せる`;}
    case 'tsubame':return d.ym?`役満も仕込める（今は${yk(d.ym.k)}が近い）`:'好きな役のテンパイを仕込む';
    case 'kami':{const y=ymDistances(myBase())[0];return `${yk(y.k)}のテンパイになる`;}
    case 'note':return G.curse&&G.curse.writer===0?'呪いが回るのを待っている……':(S.opts.noteDelay?'書くと、しばらくして相手が倒れる':'書いたら人狼が始まる');
  }
  return CHEATS[k].d;
}
function partyPanel(){
  const K=G.k,me=G.players[0];const g=me.gauge||0;
  const list=CHEAT_KEYS.filter(k=>k!=='note'||S.opts.note).map(k=>({k,u:canUse(0,k),cost:cheatCost(0,k)}));

      <span class="cn">${C.n}</span><span class="cc ${cost<C.c?'disc':''}">${cost}</span><span class="cd">${u.ok?cheatPreview(k):(used?'この対局では使用済み':(u.why||C.d))}</span></button>`;}).join('');

  const nUse=list.filter(x=>x.u.ok).length;

    ${nUse?`<div class="cgrid">${cards}</div>`:''}
    ${lockL.length?`<button class="lnk lockt" data-a="locktoggle" aria-expanded="${!!S.showLocked}">まだ使えない技 ${lockL.length}つ${S.showLocked?'を閉じる':'を見る'}</button>${S.showLocked?`<div class="lgrid">${locked}</div>`:''}`:''}
    <p class="cnote">打つたびにゲージがたまる。振り込んだり、イカサマをかけられたりしても少したまる。</p>

function targetButtons(filter,action){

// ---- イカサマのおすすめ（ナビ）
const NAV=()=>S.opts.callNavi;
const keyTileOf=k=>{const me=G.players[0];return k==null?null:k==='d'?me.drawn:me.hand[+k];};
function discardKey(){const me=G.players[0];const pick=chooseDiscard(0,myBase(),me.kuikae||[]).t;return me.drawn===pick?'d':String(me.hand.indexOf(pick));}
function swapEffects(key){ // 選んだ手牌を、山の各牌に替えたときの効果
  const me=G.players[0],K=G.k;const sig=`${key}|${K.wall.length}|${myBase().join(',')}`;
  if(S.swapFx&&S.swapFx.sig===sig)return S.swapFx.fx;
  const base=myBase();const F=FF(me);const idx=key==='d'?base.length-1:+key;const cur=shantenAny(base,F);const wc=counts(K.wall);const fx=[];
  for(let t=0;t<34;t++){if(!wc[t]||t===base[idx]){fx[t]=null;continue;}const nb=base.slice();nb[idx]=t;
    if(me.drawn!=null&&isAgariC(counts(nb))){const r=evalWin(nb,key==='d'?t:me.drawn,tsumoCtx(0));if(r&&r.yaku.length){fx[t]='win';continue;}}
    const s=shantenAny(nb,F);fx[t]=s<cur?'up':s>cur?'down':'same';}
  S.swapFx={sig,fx};return fx;
}
function iyaPlan(j){ // 嫌がらせ：相手のシャンテンが一番遠くなる組み合わせ
  const T=G.players[j],K=G.k;const wc=counts(K.wall);const F=FF(T);const cur=shanten(counts(T.hand),F);let best=null;
  const cand=[...Array(34).keys()].filter(x=>wc[x]&&!T.hand.includes(x)).sort((a,b)=>(b>=27)-(a>=27));
  T.hand.forEach((t,ix)=>{if(ix>0&&T.hand[ix-1]===t)return;for(const x of cand.slice(0,12)){const h=T.hand.slice();h[ix]=x;const s=shanten(counts(h),F);if(!best||s>best.s)best={ix,old:t,t:x,s};}});
  return best&&best.s>cur?{...best,cur}:null;
}
function recBox(html,action){return `<div class="frec"><span class="frl">おすすめ</span><span class="frb">${html}</span>${action?`<button class="btn sm primary" data-a="${action}">このとおりにする</button>`:''}</div>`;}
const tl=t=>`<span class="mt">${tileHTML(t,{label:false})}</span>`;
function ownPick(multi){
  const me=G.players[0];const keys=me.hand.map((t,ix)=>[String(ix),t]);if(me.drawn!=null)keys.push(['d',me.drawn]);
  const rk=multi?null:S.recKey;

}
function flowHTML(){
  const k=S.cheat,C=CHEATS[k],me=G.players[0],K=G.k;const st=selTile();
  S.recKey=null;
  const head=`<div class="fh"><b>${C.n}</b><button class="lnk" data-a="ccancel">やめる</button></div>`;
  const step=(n,txt,done)=>`<li class="${done?'done':'cur'}">${txt}</li>`;
  const pickSel=`${step(1,st==null?'下の自分の手牌から、入れ替える牌をタップ':`<b>${tileName(st)}</b> を選んだ`,st!=null)}`;
  if(k==='ufo'){
    const wc=counts(K.wall);const b=NAV()?(S.navi||naviData()).best:null;S.recKey=b?b.key:null;
    const rec=b?recBox(`${tl(b.old)}<span class="arr">→</span>${tl(b.t)}<span class="frt">${b.win?`ツモ ${b.win.sc.total.toLocaleString()}点`:b.s===0?'テンパイ':`あと${b.s+1}枚`}</span>`,'frec'):(NAV()?'<p class="frn">今は、UFOで前に進める組み合わせがない。</p>':'');
    const fx=st!=null&&NAV()?swapEffects(S.sel):[];
    const mark=t=>!NAV()||st==null?'':(b&&S.sel===b.key&&t===b.t?'rec':fx[t]==='win'?'win':fx[t]==='up'?'up':'');
    return head+rec+`<ol class="steps">${pickSel}<li class="${st!=null?'cur':''}">欲しい牌を選ぶ（数字は山の残り）</li></ol>${ownPick(false)}${st!=null?(NAV()?'<p class="legend"><span><i class="lg rec"></i>いちばんおすすめ</span><span><i class="lg up"></i>アガリに近づく</span><span><i class="lg win"></i>そのままツモれる</span></p>':'')+palette(t=>`<button class="pt ${mark(t)}" data-a="cdo" data-t="${t}" ${wc[t]?'':'disabled'}>${tileHTML(t,{label:false})}<span class="cnt">${wc[t]}</span></button>`):''}`;
  }
  if(k==='nidomi'){
    const rivers=G.players.map((p,j)=>({p,j})).filter(x=>x.p.river.some(r=>!r.taken));
    const b=NAV()?(S.navi||naviData()).river:null;S.recKey=b?b.key:null;
    const rec=b?recBox(`${tl(b.old)}<span class="arr">→</span>${G.players[b.o].name}の${tl(b.t)}<span class="frt">${b.s===0?'テンパイ':`あと${b.s+1}枚`}</span>`,'frec'):(NAV()?'<p class="frn">今は、拾って前に進める捨て牌がない。</p>':'');
    return head+rec+`<ol class="steps">${pickSel}<li class="${st!=null?'cur':''}">拾いたい捨て牌をタップ</li></ol>${ownPick(false)}${st!=null?rivers.map(x=>`<div class="rv"><span class="rvn">${x.p.name}</span><div class="row">${x.p.river.map((r,ix)=>r.taken?'':`<button class="pt ${b&&b.o===x.j&&b.ix===ix&&S.sel===b.key?'rec':''}" data-a="cdo" data-o="${x.j}" data-ix="${ix}">${tileHTML(r.t,{label:false})}</button>`).join('')}</div></div>`).join(''):''}`;
  }

const GLOSS={
  'シャンテン':'テンパイまであと何枚入れ替えが必要か、という数。「2シャンテン」なら、いい牌があと2枚来るとテンパイ。0になったらテンパイ。',

  '待ち':'テンパイしているときに、アガれる牌のこと。待ちの形には両面・嵌張・辺張・双碰・単騎がある。嵌張・辺張・単騎は符が2つく。',

  '満貫':'点数の上限の段階。5翻（または基本点2000点以上）で満貫、6〜7翻で跳満、8〜10翻で倍満、11〜12翻で三倍満、13翻以上で数え役満。符は関係なくなる。',

  'ドラ':'持っているだけで1枚1翻増えるボーナス牌。ドラ表示の牌の「次」の牌がドラ（九の次は一、東南西北・白發中は順番に回る）。',
  '裏ドラ':'リーチしてアガったときだけ見られるドラ。ドラ表示の下の牌の「次」がドラになる。',
  '本場':'連荘や流局で積まれる数。1本場ごとに、アガった人は300点多くもらえる（ツモなら1人100点ずつ）。',
  '供託':'場に出ているリーチ棒（1本1000点）。次にアガった人が全部もらえる。',
  '親':'その局の東家。アガると点数が1.5倍。アガるかテンパイで流局すると、親を続けられる（連荘）。',
  'ツモ':'自分で引いた牌でアガること。全員から点数をもらう。',
  'ロン':'他の人が捨てた牌でアガること。捨てた人が1人で全部払う。',

  '鳴き':'ポン・チー・カンで他の人の捨て牌をもらうこと。鳴くと門前じゃなくなり、使えない役や翻が下がる役がある。',
  '食い下がり':'鳴いたことで翻が1つ下がる役（混一色・一気通貫など）。',
  '門前':'ポン・チー・明槓をしていない手。暗槓はしていても門前のまま。リーチや平和は門前でないとつかない。',
  '雀頭':'アガリの形に1組だけ必要な同じ牌2枚のペア。',
  '面子':'3枚1組のセット。順子（123のような並び）か刻子（同じ牌3枚）。アガリは4面子＋雀頭。',

  'ゲージ':'イカサマに使うエネルギー。牌を切るたびにたまる。振り込んだり、イカサマをかけられたりしても少したまる。',
};
const GLOSS_ALIAS={'翻数':'翻','跳満':'満貫','倍満':'満貫','三倍満':'満貫','数え役満':'満貫','ダブル役満':'役満'};

// ---- 点数の内訳
function fuParts(res,tsumo,ctx){
  if(res.kokushi)return null;
  if(res.chiitoi)return {items:[['七対子は25符で固定',25]],fu:25};
  if(res.yaku.includes('pinfu'))return {items:[[tsumo?'平和のツモは20符で固定':'平和のロンは30符で固定',tsumo?20:30]],fu:tsumo?20:30};
  const items=[['副底（だれでも最初につく）',20]];
  if(res.menzen&&!tsumo)items.push(['門前でロン',10]);
  if(tsumo)items.push(['ツモ',2]);
  res.ms.forEach(m=>{if(m.type!=='k')return;let b=isTH(m.t)?4:2;if(m.ankou)b*=2;if(m.kan)b*=4;
    const kind=m.kan?(m.ankou?'暗槓':'明槓'):(m.ankou?'暗刻':'明刻');items.push([`${tileName(m.t)}の${kind}（${isTH(m.t)?'1・9・字牌':'2〜8'}）`,b]);});
  const p=res.pair;
  if(p>=31)items.push([`雀頭が三元牌（${tileName(p)}）`,2]);
  if(p===ctx.seat)items.push([`雀頭が自風（${tileName(p)}）`,2]);
  if(p===ctx.round)items.push([`雀頭が場風（${tileName(p)}）`,2]);
  if(['kanchan','penchan','tanki'].includes(res.wait))items.push([`${WAITN[res.wait].split('（')[0]}待ち`,2]);
  const raw=items.reduce((a,x)=>a+x[1],0);let fu=Math.ceil(raw/10)*10;let note=raw!==fu?`合計${raw}符 → 10の位に切り上げて${fu}符`:'';
  if(!res.menzen&&fu<30){fu=30;note=`合計${raw}符。鳴いていて30符未満なので30符`;}
  return {items,fu,note};
}
function calcView(r){
  const res=r.res,sc=r.sc;if(!r.ctx)return '';
  if(S.calcHide)return `<button class="lnk calct" data-a="calctoggle">点数の内訳を見る</button>`;
  const n=v=>v.toLocaleString();const rows=[];
  if(!sc.ym){
    const fp=fuParts(res,r.tsumo,r.ctx);
    if(fp)rows.push(`<div class="cstep"><b>① ${term('符')}</b><ul>${fp.items.map(([l,v])=>`<li><span>${l}</span><span>${v}符</span></li>`).join('')}</ul>${fp.note?`<p>${fp.note}</p>`:''}</div>`);
    const yh=res.han;
    rows.push(`<div class="cstep"><b>② ${term('翻')}</b><ul><li><span>役</span><span>${yh}翻</span></li>${sc.dora?`<li><span>${term('ドラ')}</span><span>${sc.dora}翻</span></li>`:''}${sc.ura?`<li><span>${term('裏ドラ')}</span><span>${sc.ura}翻</span></li>`:''}<li class="sum"><span>合計</span><span>${sc.han}翻</span></li></ul></div>`);
    const raw=sc.fu*Math.pow(2,sc.han+2);
    rows.push(`<div class="cstep"><b>③ 基本点</b><p>${sc.fu}符 × 2<sup>${sc.han}+2</sup> = ${n(raw)}点${sc.limit?`。${term(sc.limit)}なので基本点は <b>${n(sc.base)}点</b>`:raw>=2000?'':''}</p></div>`);
  }else{
    rows.push(`<div class="cstep"><b>① ${term('役満')}</b><p>役満は符も翻も関係なく、基本点8000点。${sc.ym>1?`${sc.ym}倍役満なので×${sc.ym}。`:''}${sc.limit.includes('気まぐれ')?'店長の気まぐれでさらに2倍。':''}基本点は <b>${n(sc.base)}点</b>。</p></div>`);
  }
  const who=sc.isD?term('親'):'子',num=sc.ym?'②':'④';
  let pay;
  if(!r.tsumo||G.n===2)pay=`${who}の${r.tsumo?'ツモ（2人打ちはロンと同じ）':term('ロン')}：基本点 × ${sc.isD?6:4} = ${n(sc.base*(sc.isD?6:4))} → 100点単位に切り上げて <b>${n(sc.ron)}点</b>`;
  else if(sc.isD)pay=`親の${term('ツモ')}：子3人がそれぞれ 基本点 × 2 = ${n(sc.base*2)} → <b>${n(sc.tsD)}点</b>ずつ（合計${n(sc.total)}点）`;
  else pay=`子の${term('ツモ')}：親が 基本点 × 2 → <b>${n(sc.tsD)}点</b>、子の2人が 基本点 × 1 → <b>${n(sc.tsC)}点</b>ずつ（合計${n(sc.total)}点）`;
  const extra=[];
  if(r.hb)extra.push(`${term('本場')}が${r.hb}本：+${n(r.hb*300)}点${r.tsumo&&G.n===4?'（1人100点ずつ）':''}`);
  if(r.kyo)extra.push(`${term('供託')}のリーチ棒${r.kyo}本：+${n(r.kyo*1000)}点`);
  rows.push(`<div class="cstep"><b>${num} 払う点数</b><p>${pay}</p>${extra.map(x=>`<p>${x}</p>`).join('')}</div>`);
  return `<div class="calc"><div class="calch"><span>点数の内訳</span><button class="lnk" data-a="calctoggle">閉じる</button></div>${rows.join('')}</div>`;
}

const todayKey=()=>{const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;};
function todayMissions(){
  const day=todayKey();
  if(!rec.mis||rec.mis.day!==day){
    let h=0;for(const ch of day)h=(h*31+ch.charCodeAt(0))>>>0;
    const pool=MISSIONS.filter(m=>!m.opt||S.opts[m.opt]).map(m=>m.k);const pick=[];
    while(pick.length<3&&pool.length){h=(h*1103515245+12345)>>>0;pick.push(pool.splice(h%pool.length,1)[0]);}
    rec.mis={day,list:pick,prog:{},done:[]};
  }
  return rec.mis.list.map(k=>MISSIONS.find(m=>m.k===k)).filter(Boolean);
}
function missionEv(ev,n=1){
  if(!S.opts.missions||!G||!isParty())return;
  const ms=todayMissions(),M=rec.mis;let got=null;
  for(const m of ms){
    if(m.ev!==ev||M.done.includes(m.k))continue;
    M.prog[m.k]=Math.min(m.goal,(M.prog[m.k]||0)+n);
    if(M.prog[m.k]>=m.goal){M.done.push(m.k);got=m;if(G.players[0])G.players[0].gauge=Math.min(100,(G.players[0].gauge||0)+20);}
  }
  if(got){
    const all=M.done.length>=ms.length;
    S.toast={text:`ミッション達成：${got.n}　ゲージ＋20${all?'　（今日は全部クリア！）':''}`,until:Date.now()+3600};setTimeout(render,3700);
    if(all){rec.cnt.misAll=(rec.cnt.misAll||0)+1;checkTitles();}
  }
  persist();
}
function missionsHTML(compact){
  if(!S.opts.missions)return '';
  const ms=todayMissions(),M=rec.mis;
  const li=ms.map(m=>{const p=M.prog[m.k]||0,ok=M.done.includes(m.k);return `<li class="${ok?'ok':''}"><span>${ok?'✓ ':''}${m.n}</span><span class="mp">${ok?'達成':`${p} / ${m.goal}`}</span></li>`;}).join('');

// ---- 鳴きのナビ：ポン・チー・カンしたほうがいいか
function openYakuHint(P,j,t,kind,use){
  // 鳴いたあとに残りそうな役の名前（なければ null）
  const melds=P.melds.map(m=>({kind:m.kind,t:m.t}));
  if(kind!=='chi'&&isYakuhaiT(j,t))return `役牌（${tileName(t)}）`;
  const ym=melds.find(m=>m.kind!=='chi'&&isYakuhaiT(j,m.t));if(ym)return `役牌（${tileName(ym.t)}）`;
  const rest=P.hand.slice();use.forEach(u=>rest.splice(rest.indexOf(u),1));
  const all=[...rest,t,...use];P.melds.forEach(m=>all.push(...meldTiles(m)));
  const pc=counts(rest);
  if(pc.some((n,x)=>n>=2&&isYakuhaiT(j,x)))return '役牌（対子をもう1枚で）';
  if(all.filter(isTH).length===0)return 'タンヤオ（喰いタン）';
  const suits=new Set(all.filter(x=>x<27).map(x=>Math.floor(x/9)));
  if(suits.size===1)return all.some(x=>x>=27)?'混一色':'清一色';
  if(suits.size<=1||(suits.size===2&&all.filter(x=>x<27&&Math.floor(x/9)!==[...suits][0]).length<=2&&all.filter(x=>x<27&&Math.floor(x/9)===[...suits][0]).length>=all.length-4))return '混一色ねらい';
  if(kind!=='chi'&&P.melds.every(m=>m.kind!=='chi')){const pairs=pc.filter(n=>n>=2).length;if(pairs+P.melds.length+1>=4)return '対々和';}
  return null;
}
function callAdvice(){
  if(!S.opts.callNavi)return null;
  const K=G.k,C=K.call,P=G.players[0];if(!C||!C.opts)return null;
  const t=C.t,o=C.opts,F=FF(P),c=counts(P.hand),cur=shanten(c,F),menzen=isMenzen(P);
  const cand=[];
  const add=(kind,use,ix)=>{
    const c2=c.slice();use.forEach(u=>c2[u]--);
    const s=kind==='minkan'?shanten(c2,F+1):bestAfterCall(P,c2,F+1);
    cand.push({kind,ix,use,s,yaku:openYakuHint(P,0,t,kind,use)});
  };
  if(o.pon)add('pon',[t,t]);
  if(o.kan)add('minkan',[t,t,t]);
  (o.chi||[]).forEach((p,ix)=>add('chi',p,ix));
  if(!cand.length)return null;
  const KN={pon:'ポン',minkan:'カン',chi:'チー'};
  const name=x=>x.kind==='chi'?`チー（${sortT([x.use[0],t,x.use[1]]).map(tileName).join('')}）`:KN[x.kind];
  const why=[];let rec=null;
  const yhk=x=>x.kind!=='chi'&&isYakuhaiT(0,t);
  const good=cand.filter(x=>x.yaku&&(x.s<cur||((x.kind==='minkan'||yhk(x))&&x.s<=cur)));
  good.sort((a,b)=>a.s-b.s||(a.kind==='chi')-(b.kind==='chi')||(a.kind==='minkan')-(b.kind==='minkan'));
  const sTxt=s=>s<=0?'テンパイ':`${s}シャンテン`;
  const yhPon=cand.find(x=>x.kind!=='chi'&&isYakuhaiT(0,t));
  if(menzen&&cur<=1&&!yhPon&&!(good[0]&&good[0].s===0&&cur===1&&good[0].yaku&&!good[0].yaku.includes('ねらい')&&!good[0].yaku.includes('対子'))){
    why.push(cur===0?'もうテンパイしている。鳴くと待ちが崩れるし、門前ならリーチやツモで点数が上がる':'テンパイ目前。門前のままリーチを狙ったほうが点数が高くなりやすい');
  }else if(good.length){
    rec=good[0];
    why.push(rec.s<cur?`${name(rec)}すると ${sTxt(cur)} → <b>${sTxt(rec.s)}</b>`:`${name(rec)}しても ${sTxt(cur)} のままだけど、役が確定するのが大きい`);
    why.push(`鳴いても役が残りそう：<b>${rec.yaku}</b>`);
    if(rec.kind==='minkan')why.push('カンするとドラが1枚増える（相手にも乗るかも）');
    if(menzen&&!yhPon)why.push('門前ではなくなるので、リーチはできなくなる');
  }else{
    const noYaku=cand.filter(x=>!x.yaku);
    if(noYaku.length===cand.length)why.push('鳴くと役がなくなりそう。役がないとアガれない（門前ならリーチで役がつく）');
    else why.push(`鳴いても形が良くならない（今 ${sTxt(cur)}）`);
  }
  if(K.wall.length<=8&&!rec&&cand.some(x=>x.yaku&&x.s===0&&cur>0))why.push('山が少ないので、テンパイを取るために鳴くのもあり');
  return {rec,why,label:rec?`${name(rec)}がおすすめ`:'スルーがおすすめ',recKey:rec?(rec.kind==='chi'?'chi'+rec.ix:rec.kind):'pass'};
}
function kanAdvice(kind,t){
  if(!S.opts.callNavi)return '';
  const P=G.players[0],F=FF(P);const tiles=[...P.hand];if(P.drawn!=null)tiles.push(P.drawn);
  const cur=shantenAny(tiles,F);const rest=tiles.filter(x=>x!==t);if(kind==='kakan')rest.push(t,t,t);
  const s=kind==='ankan'?shantenAny(rest,F+1):cur;
  if(kind==='ankan')return s<=cur?`暗槓しても形は崩れない。門前のままでドラが1枚増えるからおすすめ`:`暗槓すると形が崩れる（${cur<=0?'テンパイ':cur+'シャンテン'}→${s<=0?'テンパイ':s+'シャンテン'}）。しないほうがいいかも`;
  return `加槓するとドラが1枚増える。ただ、その牌でアガれる人がいると「槍槓」でロンされることがある`;
}

const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ON={screen:'entry',name:rec.onlineName||'',code:'',err:'',room:null,mode:'four',seats:4,rules:null,drafts:{}};

const MAX_MEMBERS=10;
const playersOf=R=>R.members.filter(m=>m.role!=='watch');
const watchersOf=R=>R.members.filter(m=>m.role==='watch');

// ---- ダミーの通信（お試し用）
const DUMMY=[{name:'トモ',lines:['よろしく！','UFO呼ぶ準備はできてる','今日は役満出す気がする','ちょっと待って、お茶いれてくる','準備OK！']},
  {name:'ユウ',lines:['よろしくお願いします','台パンは控えめにね笑','キャラどうしよう','いけます']},
  {name:'ケン',lines:['よっす','負けたら呪いの雀譜に書くからな','始めよう始めよう','準備できたら教えて']}];
const NetMock={
  real:false,ready:true,me:'me',ep:0,
  _emit(){if(ON.room){ON.room=Object.assign({},ON.room);}render();},
  _later(ms,fn){const e=this.ep;setTimeout(()=>{if(e===this.ep&&ON.room)fn();},ms);},
  _sys(text){ON.room.chat.push({channel:'room',sys:true,text,t:Date.now()});},
  _say(id,text){const m=ON.room.members.find(x=>x.id===id);if(!m)return;ON.room.chat.push({channel:'room',from:id,name:m.name,text,t:Date.now()});this._emit();},
  _freeChar(){const used=ON.room.members.map(m=>m.char);const f=CHARS.map(c=>c.k).filter(k=>!used.includes(k));return f.length?f[rnd(f.length)]:null;},
  _addDummy(ix){
    const R=ON.room;if(!R||R.members.length>=MAX_MEMBERS)return;
    const d=DUMMY[ix];if(R.members.some(m=>m.name===d.name))return;
    const id='d'+ix;R.members.push({id,name:d.name,char:null,ready:false,role:playersOf(R).length<R.seats?'play':'watch'});this._sys(`${d.name}が入室した`);this._emit();
    this._later(900+rnd(900),()=>{const m=R.members.find(x=>x.id===id);if(!m)return;if(R.rules.chars&&m.role==='play')m.char=this._freeChar();this._say(id,d.lines[0]);});
    this._later(3500+rnd(3000),()=>{const m=R.members.find(x=>x.id===id);if(!m)return;m.ready=true;this._say(id,d.lines[d.lines.length-1]);this._hostCheck();});
  },
  _hostCheck(){ // ダミーが部屋主のとき：全員準備OKなら開始
    const R=ON.room;if(!R||R.hostId===this.me)return;
    if(playersOf(R).every(m=>m.id===R.hostId||m.ready)&&R.status==='waiting'){R.status='countdown';this._sys('全員そろった。3秒後に対局開始');this._emit();
      this._later(3000,()=>{if(ON.room&&ON.room.status==='countdown')this.start(true);});}
  },
  create({name,mode,seats,rules}){
    this.ep++;const code=String(1000+rnd(9000));
    ON.room={code,hostId:this.me,mode,seats,rules,status:'waiting',members:[{id:this.me,name,char:null,ready:false,role:'play'}],chat:[]};
    this._sys(`部屋 ${code} を作った。番号を友だちに教えよう`);
    this._later(1800,()=>this._addDummy(0));if(seats>=3)this._later(5200,()=>this._addDummy(1));
    ON.screen='room';this._emit();
  },
  join(code,name){
    this.ep++;
    if(code==='0000'){ON.err='その番号の部屋は見つからなかった。番号をもう一度確かめてね';render();return;}
    if(code==='9999'){ON.err='その部屋はもう満員みたい';render();return;}
    const rules={};RULE_KEYS().forEach(k=>rules[k]=OPT_DEF[k]);
    ON.room={code,hostId:'d2',mode:'four',seats:4,rules,status:'waiting',members:[{id:'d2',name:'ケン',char:'rikishi',ready:true,role:'play'},{id:'d0',name:'トモ',char:'alien',ready:false,role:'play'},{id:this.me,name,char:null,ready:false,role:'play'}],
      chat:[{channel:'room',from:'d2',name:'ケン',text:'よっす',t:Date.now()-60000}]};
    this._sys(`${name}が入室した`);ON.screen='room';ON.err='';
    this._later(1500,()=>this._say('d2',DUMMY[2].lines[1]));
    this._later(4500,()=>{const m=ON.room.members.find(x=>x.id==='d0');if(m){m.ready=true;this._say('d0','準備OK！');this._hostCheck();}});
    this._emit();
  },
  leave(){this.ep++;ON.room=null;ON.screen='entry';render();},
  setReady(v){const R=ON.room,m=R.members.find(x=>x.id===this.me);m.ready=v;this._emit();if(v)this._hostCheck();},
  setRole(role){const R=ON.room,m=R.members.find(x=>x.id===this.me);if(role==='play'&&playersOf(R).length>=R.seats)return;m.role=role;m.ready=false;if(role==='watch')m.char=null;this._emit();this._hostCheck();},
  pickChar(k){const R=ON.room;if(k&&R.members.some(m=>m.id!==this.me&&m.char===k))return;R.members.find(x=>x.id===this.me).char=k;this._emit();},
  setRules(p){const R=ON.room;if(R.hostId!==this.me)return;Object.assign(R,p);
    if(R.mode==='duel')R.seats=2;
    playersOf(R).slice(R.seats).forEach(m=>{m.role='watch';m.ready=false;m.char=null;this._sys(`人数が減ったので${m.name}は観戦にまわった`);});
    if(!R.rules.chars)R.members.forEach(m=>m.char=null);
    if(R.members.some(m=>m.id!==this.me&&m.ready)){R.members.forEach(m=>{if(m.id!==this.me)m.ready=false;});this._sys('ルールが変わったので、みんなの準備OKを解除した');}

  },
  chat(channel,text){

    R.chat.push({channel,from:this.me,name:m.name,text,t:Date.now()});if(R.chat.length>80)R.chat.splice(0,R.chat.length-80);this._emit();
    const others=R.members.filter(x=>x.id.startsWith('d'));
    if(others.length&&Math.random()<.7){const o=others[rnd(others.length)];const d=DUMMY[+o.id.slice(1)];this._later(1000+rnd(1500),()=>this._say(o.id,d.lines[1+rnd(d.lines.length-2)]));}
  },
  start(byHost){
