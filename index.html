const FakeFB=(()=>{
  const KEY='tsubame-fakefb';let ch=null;try{ch=new BroadcastChannel('tsubame-fakefb');}catch(e){}
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}};
  let data=load();const ls=[];let discos=[];let firing=false,again=false;
  const split=p=>String(p).split('/').filter(Boolean);
  const get=(o,p)=>{for(const k of split(p)){if(o==null||typeof o!=='object')return null;o=o[k];}return o===undefined?null:o;};
  const clean=o=>{if(!o||typeof o!=='object')return o;for(const k of Object.keys(o)){if(o[k]&&typeof o[k]==='object'){clean(o[k]);if(!Object.keys(o[k]).length)delete o[k];}else if(o[k]==null)delete o[k];}return o;};
  const setAt=(p,v)=>{const ks=split(p);if(!ks.length){data=v||{};return;}let o=data;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]];}if(v==null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=v;};
  const res=v=>{if(v&&typeof v==='object'){if(v['.sv']==='timestamp')return Date.now();const o=Array.isArray(v)?[]:{};for(const k in v)o[k]=res(v[k]);return o;}return v;};
  const snap=(p,v)=>({key:split(p).pop()||null,val:()=>v==null?null:JSON.parse(JSON.stringify(v)),exists:()=>v!=null});
  const write=fn=>{data=load();fn();clean(data);try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}if(ch)ch.postMessage(1);fire();};
  function fireOne(l){const v=get(data,l.path);
    if(l.type==='value'){const s=JSON.stringify(v);if(s!==l.last){l.last=s;l.cb(snap(l.path,v));}}
    else{const keys=Object.keys(v&&typeof v==='object'?v:{}).sort();for(const k of keys)if(!l.keys.has(k)){l.keys.add(k);l.cb(snap(l.path+'/'+k,v[k]));}}}
  function fire(){if(firing){again=true;return;}firing=true;try{do{again=false;ls.slice().forEach(l=>{if(ls.includes(l))fireOne(l);});}while(again);}finally{firing=false;}}
  if(ch)ch.onmessage=()=>{data=load();fire();};
  let pn=0;
  function ref(path){
    const r={key:split(path).pop()||null,path,
      child:c=>ref(path+'/'+c),limitToLast:()=>r,orderByKey:()=>r,
      set:v=>{write(()=>setAt(path,res(v)));return Promise.resolve();},
      update:o=>{write(()=>{for(const k in o)setAt(path+'/'+k,res(o[k]));});return Promise.resolve();},
      remove:()=>{write(()=>setAt(path,null));return Promise.resolve();},
      push:v=>{const k=Date.now().toString(36).padStart(9,'0')+(pn++).toString(36).padStart(4,'0')+Math.random().toString(36).slice(2,6);const c=ref(path+'/'+k);if(v!==undefined)c.set(v);return c;},
      once:()=>{data=load();return Promise.resolve(snap(path,get(data,path)));},
      on:(type,cb,err)=>{const l={path,type,cb,last:undefined,keys:new Set()};ls.push(l);setTimeout(()=>{if(ls.includes(l))fireOne(l);},(window.__metaDelay&&/\/meta$/.test(path))?200:0);return cb;},
      off:(type,cb)=>{for(let i=ls.length-1;i>=0;i--)if(ls[i].path===path&&(!cb||ls[i].cb===cb))ls.splice(i,1);},
      transaction:fn=>{let out;write(()=>{const cur=get(data,path);const nv=fn(cur==null?null:JSON.parse(JSON.stringify(cur)));if(nv===undefined){out={committed:false,snapshot:snap(path,cur)};return;}setAt(path,res(nv));out={committed:true,snapshot:snap(path,nv)};});return Promise.resolve(out);},
      onDisconnect:()=>({remove:()=>{discos.push({path,v:null});return Promise.resolve();},set:v=>{discos.push({path,v});return Promise.resolve();},cancel:()=>{discos=discos.filter(d=>d.path!==path);return Promise.resolve();}}),
    };return r;
  }
  window.addEventListener('pagehide',()=>{if(discos.length)write(()=>discos.forEach(d=>setAt(d.path,d.v==null?null:res(d.v))));});
  let uid=null;try{uid=sessionStorage.getItem('tsubame-fakeuid');}catch(e){}
  if(!uid){uid='L'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem('tsubame-fakeuid',uid);}catch(e){}}
  return {ref,TS:{'.sv':'timestamp'},uid};
})();

const setReplacer=(k,v)=>v instanceof Set?{__set:[...v]}:v;

function seatOfUid(uid){if(!G||!G.remote)return null;for(const k in G.remote)if(G.remote[k]===uid)return +k;return null;}
function hostOnMembers(){
  if(!G||!G.remote||G.over)return;

    if(!here&&!gone){G.remoteGone[k]=true;NetFB.chatSys(`${G.names[k]}が抜けた。CPUが代わりに打つ`);}
    if(here&&gone){G.remoteGone[k]=false;NetFB.chatSys(`${G.names[k]}が戻ってきた`);}

function hostOnIntent(m){
  if(!G||G.over)return;const s=seatOfUid(m.uid);if(s==null||!G.players[s])return;
  try{hostApply(s,m);}catch(e){console.error(e);}
  render();

function hostApply(s,m){
  const K=G.k,P=G.players[s],n=G.n;const abs=x=>(x==null||x==='')?null:((+x+s)%n);
  switch(m.a){
    case 'discard':{
      if(K.phase!=='remote'||K.turn!==s)return;const key=m.key==='d'?'d':+m.key;
      if(key==='d'?P.drawn==null:!(key>=0&&key<P.hand.length))return;
      const t=key==='d'?P.drawn:P.hand[key];
      if(P.riichi&&key!=='d')return;if(P.drawn==null&&(P.kuikae||[]).includes(t))return;
      let decl=false;
      if(m.riichi&&!P.riichi&&isMenzen(P)&&P.drawn!=null&&K.wall.length>=4&&P.pts>=1000){const rest=[...P.hand,P.drawn];rest.splice(key==='d'?rest.length-1:key,1);decl=shanten(counts(rest),FF(P))===0;}
      P._decl=decl;doDiscard(s,key);return;}
    case 'tsumo':if(K.phase==='remote'&&K.turn===s)tsumoAct(s);return;
    case 'kan':if(K.phase==='remote'&&K.turn===s){const o=kanOptions(s).find(x=>x.kind===m.kind&&x.t===+m.t);if(o){if(o.kind==='ankan')doAnkan(s,o.t);else doKakan(s,o.t);}}return;
    case 'kyuushu':if(K.phase==='remote'&&K.turn===s&&canKyuushu(s))kyuushu();return;
    case 'call':{if(K.phase!=='rcall'||K.call.seat!==s)return;const C=K.call,o=C.opts;let use=null;
      if(m.kind==='pon'&&o.pon)use=[C.t,C.t];else if(m.kind==='minkan'&&o.kan)use=[C.t,C.t,C.t];
      else if(m.kind==='chi'){const u=(m.use||[]).map(Number);if(o.chi.some(p=>p[0]===u[0]&&p[1]===u[1]))use=u;}
      if(use)doCall(s,C.from,C.t,m.kind,use);return;}
    case 'pass':if(K.phase==='rcall'&&K.call.seat===s)passCall();return;
    case 'ron':if(K.phase==='rron'&&K.ron&&K.ron.seat===s)ronAct(s,!!m.pass);return;
    case 'cheat':{if(!CHEATS[m.key])return;const p=Object.assign({},m.p||{});
      ['target','owner','frame'].forEach(f=>{if(f in p)p[f]=abs(p[f]);});
      const e=useCheat(s,m.key,p);if(e&&e!=='pending')seatNote(s,e);return;}
    case 'counter':if(K.phase==='rcounter'&&K.pendingCounter&&K.pendingCounter.target===s)resolveCounter(!!m.yes);return;
    case 'vote':if(G.wolf)wolfVoteBy(s,abs(m.t));return;
    case 'next':if(K.phase==='end'){K.nextVotes=K.nextVotes||{};K.nextVotes[s]=true;hostCheckNext();}return;
  }
}
// 局の結果：みんなが「次へ」を押したら進む
function hostNeedNext(){return G.players.map((p,i)=>i).filter(i=>i===0||isRemote(i));}
function hostCheckNext(){const K=G.k;if(!K||K.phase!=='end')return;const need=hostNeedNext();K.nextNeed=need.length;K.nextVotes=K.nextVotes||{};if(need.every(s=>K.nextVotes[s]))nextKyoku();else render();}
function onlineNextHTML(r,peek){
  const host=!S.onlineClient&&G.remote&&Object.keys(G.remote).length;if(!S.onlineClient&&!host)return '';
  if(S.onlineClient&&S.onlineClient.spect)return `<span class="lead">みんなが次へ進むのを待っている……</span>${peek}`;
  const K=G.k,v=K.nextVotes||{},need=host?hostNeedNext().length:(K.nextNeed||1),n=Object.keys(v).length;const lab=willEnd(r)?'結果を見る':'次の局へ';
  return v[0]?`<button class="btn lg" disabled>ほかの人を待っている（${n}/${need}）</button>${peek}`:`<button class="btn primary lg" data-a="next">${lab}（${n}/${need}）</button>${peek}`;
}
// 抜けた人・止まった人の代打ち
function hostWatch(){
  if(!Net.real||!Net.host||!G||!G.remote||G.over||!G.k)return;
  const K=G.k;let s=null;
  if(K.phase==='end'&&!G.wolf){const need=hostNeedNext();if(K.nextNeed!==need.length){K.nextNeed=need.length;render();}if(!K.endAt)K.endAt=Date.now();
    if(need.every(x=>(K.nextVotes||{})[x])||Date.now()-K.endAt>90000){nextKyoku();return;}}
  if(K.phase==='remote')s=K.turn;else if(K.phase==='rcall'&&K.call)s=K.call.seat;else if(K.phase==='rron'&&K.ron)s=K.ron.seat;
  if(s!=null&&(!isRemote(s)||Date.now()-(K.waitSince||0)>60000)){
    const ph=K.phase;K.waitSince=Date.now();
    if(ph==='remote'){if(G.players[s].drawn==null)cpuDiscardAfterCall(s);else cpuAct(s);}
    else if(ph==='rcall')passCall();else if(ph==='rron')ronAct(s,false);
  }
  const W=G.wolf;
  if(W&&W.stage!=='result'){
    const late=Date.now()-(W.at||0)>150000;
    G.players.forEach((p,i)=>{if(i===W.victim||p.dead||W.votes[i]!=null)return;if(i!==0&&(!isRemote(i)||late))W.votes[i]=cpuWolfVote(i);});
    if(G.players.every((p,i)=>i===W.victim||p.dead||W.votes[i]!=null))finishWolf();
  }

const ORIG={};
const CLIENT_OVR={
  doDiscard:(i,key)=>{if(i!==0)return;clientSend({a:'discard',key,riichi:!!S.rPending});S.sel=null;S.rPending=false;S.best=null;},
  myTsumo:()=>clientSend({a:'tsumo'}),
  myRon:pass=>clientSend({a:'ron',pass:!!pass}),
  passCall:()=>clientSend({a:'pass'}),
  doCall:(j,from,t,kind,use)=>clientSend({a:'call',kind,use}),
  doAnkan:(i,t)=>clientSend({a:'kan',kind:'ankan',t}),
  doKakan:(i,t)=>clientSend({a:'kan',kind:'kakan',t}),
  kyuushu:()=>clientSend({a:'kyuushu'}),
  useCheat:(i,key,p={})=>{const chk=canUse(0,key);if(!chk.ok)return chk.why||'使えません';clientSend({a:'cheat',key,p});S.cheat=null;S.sel=null;S.multi=[];S.ctakes=[];S.ctarget=null;S.cframe=null;S.navi=null;return null;},

function installClient(on){
  for(const k in CLIENT_OVR){if(on){if(!(k in ORIG))ORIG[k]=window[k];window[k]=CLIENT_OVR[k];}else if(k in ORIG){window[k]=ORIG[k];delete ORIG[k];}}

function clientSend(msg){const C=S.onlineClient;if(!C||C.spect)return;C.busy=Date.now();Net.send(msg);}
function startClient(){
  const R=ON.room;if(!R)return;const seat=(R.seatMap||[]).indexOf(Net.me);
  S.optsBackup=S.optsBackup||Object.assign({},S.opts);Object.assign(S.opts,R.rules||{});
  S.onlineClient={seat:seat>=0?seat:0,spect:seat<0,gameId:R.gameId,last:null,callKey:null};
  S.onlineSetup={players:[],client:true};S.localOver=false;S.wolfVote=false;
  S.cheat=null;S.sel=null;S.rPending=false;G=null;gen++;S.onlineOpen=false;
  installClient(true);
  const ref=Net.r('state');const cb=s=>{const v=s.val();if(v)applyState(v);};
  ref.on('value',cb);S.onlineClient.unsub=()=>ref.off('value',cb);
}
function exitOnlineGame(){
  const C=S.onlineClient;
  if(C){try{C.unsub&&C.unsub();}catch(e){}S.clientDone=C.gameId;S.onlineClient=null;installClient(false);G=null;gen++;}
  else if(S.onlineSetup&&G){G=null;gen++;}
  if(S.optsBackup){Object.assign(S.opts,S.optsBackup);S.optsBackup=null;}
  S.onlineSetup=null;S.localOver=false;
}
function applyState(str){
  const C=S.onlineClient;if(!C)return;
  let d;try{d=JSON.parse(str,setReviver);}catch(e){return;}
  C.last=d;reproject();
}
function reproject(){
  const C=S.onlineClient;if(!C||!C.last)return;const d=JSON.parse(JSON.stringify(C.last,setReplacer),setReviver);
  const skew=Date.now()-d.at;const prevPhase=G&&G.k?G.k.phase:null,prevHands=G?G.hands:null;
  G=projectState(d.g,C.seat,C.spect,skew);
  const fx=d.fx||{};const host=G.hostName;
  const fixT=s=>typeof s==='string'?s.split('あなた').join(host):s;
  S.ann=fx.ann?Object.assign({},fx.ann,{who:fixT(fx.ann.who),text:fixT(fx.ann.text)}):null;
  S.blackout=fx.blackout?fx.blackout+skew:0;
  S.cutin=fx.cutin?Object.assign({},fx.cutin,{until:fx.cutin.until+skew,start:(fx.cutin.start||0)+skew,kick:fixT(fx.cutin.kick),sub:fixT(fx.cutin.sub)}):null;
  const K=G.k;
  if(K.phase!=='me'){S.sel=null;S.rPending=false;S.best=null;}
  if(prevHands!==G.hands){S.cheat=null;S.sel=null;S.multi=[];S.ctakes=[];S.ctarget=null;S.cframe=null;S.navi=null;}
  if(prevPhase!=='wolf'&&K.phase==='wolf')S.wolfVote=false;
  if(!C.spect&&K.phase==='call'&&S.callMode==='off'){const key=d.seq;if(C.callKey!==key){C.callKey=key;setTimeout(()=>clientSend({a:'pass'}),200);}}
  C.busy=0;
  render();
}
function projectState(g,seat,spect,skew){
  const n=g.n,r=x=>(x==null||x<0)?x:((+x-seat+n)%n);const rot=a=>Array.isArray(a)?a.map((_,k)=>a[(k+seat)%n]):a;
  const names=g.names||g.players.map(p=>p.name);const host=names[0]||'部屋主';
  const fixT=s=>typeof s==='string'?s.split('あなた').join(host):s;
  const P=g.players;g.players=P.map((_,k)=>P[(k+seat)%n]);
  g.players.forEach((p,k)=>{const a=(k+seat)%n;p.name=(k===0&&!spect)?'あなた':names[a];
    (p.melds||[]).forEach(m=>{if(m.from!=null)m.from=r(m.from);});
    if(p.say)p.say=Object.assign({},p.say,{until:p.say.until+skew,text:fixT(p.say.text)});});
  g.hostName=host;g.viewNames=names.map((x,a)=>x);g.dealer=r(g.dealer);
  if(g.finalRank)g.finalRank=g.finalRank.map(r);
  if(g.curse){if(g.curse.writer===seat&&!spect)g.curse={...g.curse,writer:0,victim:r(g.curse.victim),frame:r(g.curse.frame)};else g.curse=null;}
  const W=g.wolf;
  if(W){W.writer=r(W.writer);W.victim=r(W.victim);W.frame=r(W.frame);
    const v={};for(const k in W.votes)v[r(+k)]=r(W.votes[k]);W.votes=v;
    if(W.tally){const t={};for(const k in W.tally)t[r(+k)]=W.tally[k];W.tally=t;}
    (W.lines||[]).forEach(l=>{l.j=r(l.j);l.text=fixT(l.text);});W.at=(W.at||0)+skew;}
  const K=g.k;
  if(K){
    K.turn=r(K.turn);if(K.last)K.last={...K.last,i:r(K.last.i)};
    if(K.ron)K.ron={...K.ron,from:r(K.ron.from),seat:K.ron.seat==null?null:r(K.ron.seat)};
    if(K.call){const c=K.call;K.call={...c,from:r(c.from),seat:c.seat==null?null:r(c.seat),cpuPon:c.cpuPon?{...c.cpuPon,j:r(c.cpuPon.j)}:null,queue:[]};}
    if(K.pendingCounter){const pc=K.pendingCounter;K.pendingCounter={...pc,i:r(pc.i),target:r(pc.target==null?0:pc.target),until:pc.until+skew,p:{...pc.p,target:r(pc.p&&pc.p.target)}};}
    if(K.force){const f={};for(const k in K.force)f[r(+k)]=K.force[k];K.force=f;}
    if(K.skip instanceof Set)K.skip=new Set([...K.skip].map(r));
    if(K.nextVotes){const nv={};for(const k in K.nextVotes)nv[r(+k)]=true;K.nextVotes=nv;}
    if(K.result){const R=K.result;if(R.wi!=null)R.wi=r(R.wi);if(R.from!=null)R.from=r(R.from);R.pay=rot(R.pay);R.tenpai=rot(R.tenpai);}
    const nt=K.notes&&K.notes[seat];K.note=(!spect&&nt&&Date.now()-skew-nt.at<8000)?nt.msg:'';K.msg='';
    K.log=(K.log||[]).map(fixT);
    const ph=K.phase;let np=ph;
    if(spect)np=['deal','end','wolf'].includes(ph)?ph:'cpu';
    else if(ph==='remote')np=K.turn===0?'me':'cpu';
    else if(ph==='rcall')np=K.call.seat===0?'call':'cpu';
    else if(ph==='rron')np=K.ron&&K.ron.seat===0?'ron':'cpu';
    else if(ph==='rcounter')np=K.pendingCounter&&K.pendingCounter.target===0?'counter':'cpu';
    else if(['me','call','ron','counter'].includes(ph))np='cpu';
    K.phase=np;
    if(np==='call'){K.call.opts=K.call.opts||{pon:false,kan:false,chi:[]};}
  }
  g.remote=null;g.remoteGone=null;g.spect=spect;
  return g;
}

  const order=[...setup.players.slice(me),...setup.players.slice(0,me)];
  const remote={};if(Net.real)order.forEach((p,i)=>{if(i>0)remote[i]=p.id;});
  S.onlineSetup={players:order,remote:Net.real&&order.length>1?remote:null};S.myChar=order[0].char;

function onlineSetupPlayers(players){ // startGame から呼ぶ

function onlineSetupChars(players){

}
function chatHTML(ch,list,quick){
  const id='chat-'+ch;
  return `<section class="rsec chat"><div class="grp-t">チャット</div>
    <ol class="clog" id="clog-${ch}" aria-live="polite">${list.length?list.map(c=>c.sys?`<li class="sys">${escH(c.text)}</li>`:`<li class="${(c.from===Net.me||c.from===0)&&!c.cpu?'mine':''}${c.cpu?' cpu':''}"><b>${escH(c.name)}</b><span>${escH(c.text)}</span></li>`).join(''):'<li class="sys">まだ誰も話していない</li>'}</ol>
    <div class="qchips">${quick.map(q=>`<button class="chip" data-a="chatq" data-ch="${ch}" data-v="${escH(q)}">${escH(q)}</button>`).join('')}</div>
    <div class="cin">${inputHTML(id,{attrs:'maxlength="60" placeholder="メッセージ" aria-label="メッセージ"',enter:'chatsend'})}<button class="btn primary" data-a="chatsend" data-ch="${ch}">送る</button></div></section>`;
}
// 対局中：接続待ち・観戦バー
function clientWaitView(){return `<section class="hero"><div class="kicker">オンライン対戦</div><h1>卓に<span>つないでいる</span></h1><p>部屋主のブラウザから盤面が届くのを待っている……</p></section><div class="btns"><button class="btn" data-a="onleave">部屋を出る</button></div>`;}
function spectBarHTML(){
  const C=S.onlineClient;if(!C||!C.spect||!C.last)return '';const names=C.last.g.names||[];
  return `<div class="spbar" role="group" aria-label="観戦する人"><b>観戦中</b><span>だれの目線で見る？</span>${names.map((nm,a)=>`<button class="btn sm ${C.seat===a?'on':''}" data-a="watchseat" data-j="${a}">${escH(nm)}</button>`).join('')}<button class="lnk" data-a="onleave">部屋を出る</button></div>`;
}

// ---- 対局中のチャット（オンラインのとき）
const roomChatList=()=>ON.room?ON.room.chat.filter(c=>c.channel==='room'):[];
function gameChatBtn(){if(!Net.real||!ON.room||!G)return '';const n=roomChatList().filter(c=>!c.sys).length;const un=Math.max(0,n-(S.chatSeen||0));return `<button class="btn sm chatb" data-a="chatopen">チャット${un?`<span class="badge">${un}</span>`:''}</button>`;}
function gameChatOverlay(){
  if(!Net.real||!ON.room||!G)return '';
  if(S.chatOpen){S.chatSeen=roomChatList().filter(c=>!c.sys).length;return `<div class="chatsheet" role="dialog" aria-label="チャット"><div class="csh"><b>チャット</b><button class="lnk" data-a="chatclose">閉じる</button></div>${chatHTML('room',roomChatList(),['ナイス！','うそでしょ','やられた～','はやく！'])}</div>`;}
  if(S.chatPop&&S.chatPop.until>Date.now())return `<button class="chatpop" data-a="chatopen"><b>${escH(S.chatPop.name)}</b><span>${escH(S.chatPop.text)}</span></button>`;
  return '';
}
// ---- 人狼タイムのチャット
function wolfChatHTML(){
  const W=G.wolf;if(!W)return '';
  if(Net.real&&ON.room){const gid=ON.room.gameId;return chatHTML('wolf',ON.room.chat.filter(c=>c.channel==='wolf'&&c.gid===gid),['あやしい……','私じゃない！','ゲージ見て','信じて']);}
  return ''; // ひとりで遊ぶときは話す相手がいないのでチャットは出さない
}
function wolfChatSend(text){
  if(Net.real&&ON.room){Net.chat('wolf',text);return;}
  const W=G.wolf;W.chat=W.chat||[];
  W.chat.push({from:0,name:'あなた',text,t:Date.now()});
  const alive=G.players.map((p,j)=>j).filter(j=>j!==0&&j!==W.victim&&!G.players[j].dead);if(!alive.length)return;
  const named=alive.find(j=>text.includes(G.players[j].name));
  const j=named!=null?named:alive[rnd(alive.length)];const nm=x=>x===0?'あなた':G.players[x].name;
  const pool=named!=null
    ?(j===W.writer?['え、私？ そんなわけないでしょ……','ちょ、ちょっと待って。証拠あるの？',`${nm(alive.find(x=>x!==j)??0)}のほうが怪しいって！`]:['私は書いてない！ 本当だよ','疑うならゲージを見てよ',`むしろ${nm(W.writer)}が静かすぎない？`])
    :(j===W.writer?['うーん、誰だろうね','落ち着いていこう','あなたが一番怪しかったりして'] :[`${nm(W.writer)}がさっきから目をそらしてる`,'私は最初から怪しい人がいると思ってた','ゲージを一気に使った人を探そう']);
  const g=gen;setTimeout(()=>{if(g!==gen||!G||!G.wolf)return;W.chat.push({from:j+100,name:G.players[j].name,text:pool[rnd(pool.length)],t:Date.now()});render();},700+rnd(900));
}

// ---- 入力欄：再描画しても書きかけと日本語入力が消えないように
document.addEventListener('input',e=>{const el=e.target;if(el.classList&&el.classList.contains('tin')){let v=el.value;if(el.id==='on-code'){v=v.replace(/\D/g,'').slice(0,4);if(v!==el.value)el.value=v;}ON.drafts[el.id]=v;if(el.id==='on-name'){const ok=!!v.trim()&&Net.ready;document.querySelectorAll('[data-a="ongo"][data-v="create"],[data-a="onjoin"]').forEach(b=>b.disabled=!ok);}}});
document.addEventListener('compositionstart',()=>{S.composing=true;});
document.addEventListener('compositionend',e=>{S.composing=false;if(e.target.classList&&e.target.classList.contains('tin'))ON.drafts[e.target.id]=e.target.value;if(S.renderPending){S.renderPending=false;render();}});
document.addEventListener('focusout',()=>{if(S.composing){S.composing=false;if(S.renderPending){S.renderPending=false;setTimeout(render,0);}}});
document.addEventListener('keydown',e=>{const el=e.target;if(e.key!=='Enter'||e.isComposing||!el.dataset||!el.dataset.enter)return;e.preventDefault();const ch=el.id.startsWith('chat-')?el.id.slice(5):null;const fake={dataset:{ch}};H[el.dataset.enter]&&H[el.dataset.enter](fake);render();});
function keepFocus(fn){
  const ae=document.activeElement;const id=ae&&ae.id&&ae.classList.contains('tin')?ae.id:null;let s=null;
  if(id){try{s=[ae.selectionStart,ae.selectionEnd];}catch(e){}}
  const logs={};document.querySelectorAll('.clog').forEach(l=>{logs[l.id]=l.scrollHeight-l.scrollTop-l.clientHeight<24;});
  fn();
  document.querySelectorAll('.clog').forEach(l=>{if(logs[l.id]!==false)l.scrollTop=l.scrollHeight;});
  if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(s)try{el.setSelectionRange(s[0],s[1]);}catch(e){}}}
}
async function copyCode(){try{await navigator.clipboard.writeText(ON.room.code);S.toast={text:`部屋番号 ${ON.room.code} をコピーした`,until:Date.now()+2200};}catch(e){S.toast={text:`部屋番号は ${ON.room.code}`,until:Date.now()+2600};}setTimeout(render,2700);render();}

const H_HOST_ONLY=['go'];
{const fn=H.next;H.next=el=>{if(S.onlineClient){if(!S.onlineClient.spect)clientSend({a:'next'});return;}if(G&&G.remote&&Object.keys(G.remote).length){const K=G.k;K.nextVotes=K.nextVotes||{};K.nextVotes[0]=true;hostCheckNext();return 'skip';}return fn(el);};}
H_HOST_ONLY.forEach(k=>{const f=H[k];H[k]=el=>S.onlineClient?undefined:f(el);});
{const fw=H.wend;H.wend=el=>{if(S.onlineClient){S.localOver=true;return;}return fw(el);};}
{const fq=H['quit-yes'];H['quit-yes']=el=>{if(S.onlineClient){S.quit=false;Net.leave();return 'skip';}return fq(el);};}
Object.assign(H,{
  online:()=>{ON.screen=ON.room?'room':'entry';S.onlineOpen=true;ON.err='';},
  onback:()=>{S.onlineOpen=false;},
  ongo:el=>{const v=el.dataset.v;if(v==='create'){const n=(ON.drafts['on-name']??ON.name).trim();if(!n)return;ON.name=n;rec.onlineName=n;persist();}ON.screen=v;ON.err='';},
  oncreate:()=>{Net.create({name:ON.name,mode:ON.mode,seats:ON.mode==='duel'?2:ON.seats,rules:Object.assign({},ON.rules)});ON.drafts['chat-room']='';return 'skip';},
  onjoin:()=>{const n=(ON.drafts['on-name']??ON.name).trim();const code=(ON.drafts['on-code']||'').trim();
    if(!n){ON.err='名前を入れてね';return;}if(!/^\d{4}$/.test(code)){ON.err='部屋番号は4桁の数字だよ';return;}
    ON.name=n;rec.onlineName=n;persist();ON.err='';Net.join(code,n);return 'skip';},
  onleave:()=>{Net.leave();return 'skip';},
  chatopen:()=>{S.chatOpen=true;S.chatPop=null;},
  chatclose:()=>{S.chatOpen=false;},
  onready:()=>{const me=ON.room.members.find(m=>m.id===Net.me);Net.setReady(!me.ready);return 'skip';},
  onrole:el=>{Net.setRole(el.dataset.v);return 'skip';},
  onchar:el=>{Net.pickChar(el.dataset.k||null);return 'skip';},
  onrule:el=>{const f=el.dataset.f,v=el.dataset.v;
    if(!ON.room){if(f==='mode')ON.mode=v;else if(f==='seats')ON.seats=+v;else ON.rules[v]=!ON.rules[v];return;}
    const R=ON.room;const p={rules:Object.assign({},R.rules)};if(f==='mode')p.mode=v;else if(f==='seats')p.seats=+v;else p.rules[v]=!p.rules[v];
    if(f==='mode'&&v==='four')p.seats=4;Net.setRules(p);return 'skip';},
  onstart:()=>{Net.start();return 'skip';},
  onpreset:el=>{const P=PRESETS[el.dataset.k];if(!P)return;const v={};RULE_KEYS().forEach(k=>v[k]=!!P.v[k]);
    if(!ON.room){Object.assign(ON.rules,v);return;}Net.setRules({rules:Object.assign({},ON.room.rules,v)});return 'skip';},
  onwatchgame:()=>{if(Net.real&&ON.room&&ON.room.status==='playing'){S.clientDone=null;startClient();}},
  watchseat:el=>{const C=S.onlineClient;if(!C||!C.spect)return;C.seat=+el.dataset.j;reproject();return 'skip';},
  oncopy:()=>{copyCode();return 'skip';},
  chatq:el=>{const ch=el.dataset.ch,t=el.dataset.v;if(ch==='wolf')wolfChatSend(t);else Net.chat('room',t);return ch==='wolf'?undefined:'skip';},
  chatsend:el=>{const ch=el.dataset.ch;const id='chat-'+ch;const t=(ON.drafts[id]||'').trim();if(!t)return;ON.drafts[id]='';if(ch==='wolf')wolfChatSend(t);else Net.chat('room',t);return ch==='wolf'?undefined:'skip';},
});

render();

</script>
